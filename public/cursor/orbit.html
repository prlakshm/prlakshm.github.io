    const pathEls = actors.map((_, i) => svg.querySelector(`path[data-path="${i}"]`));
    const outerEls = actors.map((_, i) => svg.querySelector(`g[data-actor="${i}"]`));
    const rotEls = actors.map((_, i) => svg.querySelector(`g[data-rot="${i}"]`));
    const n = actors.length;
    const hovering = new Array(n).fill(false);
    const hoverAt = new Array(n).fill(null);
    const hoverFrom = Array.from({ length: n }, () => ({ phase: 0, rotation: 0 }));
    let settled = false;
    const capture = (i) => {
      const at = hoverAt[i];
      if (at === null) return;
      const e = performance.now() / 1e3 - at;
      const toward = hovering[i] ? 1 : 0;
      for (const key of ["phase", "rotation"]) {
        const h = hover?.[key];
        if (!h) continue;
        hoverFrom[i][key] += (toward - hoverFrom[i][key]) * EASE[h.easing](clamp01(e / h.duration));
      }
    };
    rotEls.forEach((el, i) => {
      el.addEventListener("pointerenter", () => {
        if (!settled) return;
        capture(i);
        hovering[i] = true;
        hoverAt[i] = performance.now() / 1e3;
      });
      el.addEventListener("pointerleave", () => {
        if (!settled) return;
        capture(i);
        hovering[i] = false;
        hoverAt[i] = performance.now() / 1e3;
      });
    });
    function hoverOffsets(i) {
      const out = { phase: 0, rotation: 0 };
      if (!settled) return out;
      const at = hoverAt[i];
      const toward = hovering[i] ? 1 : 0;
      const e = at === null ? 0 : performance.now() / 1e3 - at;
      let maxDur = 0;
      for (const key of ["phase", "rotation"]) {
        const h = hover?.[key];
        if (!h) continue;
        maxDur = Math.max(maxDur, h.duration);
        let v = hoverFrom[i][key];
        if (at !== null) v += (toward - v) * EASE[h.easing](clamp01(e / h.duration));
        out[key] = v * h.amount;
      }
      if (at !== null && e >= maxDur) {
        for (const key of ["phase", "rotation"]) if (hover?.[key]) hoverFrom[i][key] = toward;
        hoverAt[i] = null;
      }
      return out;
    }
    let lastOrder = "";
    function draw(elapsed) {
      settled = elapsed >= settleAt;
      const depth = new Array(n).fill(0);
      const slideStart = hold + slideDelay;
      const carriage = lerp(
        carriageFrom,
        carriageTo,
        EASE.smooth(clamp01((elapsed - slideStart) / letterDuration))
      );
      for (let i = 0; i < n; i++) {
        const act = actors[i];
        const hov = hoverOffsets(i);
        const a = EASE[easing](clamp01((elapsed - hold - stagger * act.slot) / letterDuration));
        const y = (vbH - act.glyph.width) / 2 + (act.glyph.offsetY ?? 0);
        if (act.isHeart) {
          pathEls[i].setAttribute(
            "d",
            pathForGlyph({ ...act.glyph, width: CELL }, RES, a * heartTurn + hov.phase)
          );
          outerEls[i].setAttribute("transform", `translate(${(act.xFrom + carriage).toFixed(2)}, ${y.toFixed(2)})`);
          rotEls[i].setAttribute("transform", `rotate(${((act.glyph.rotation ?? 0) + hov.rotation).toFixed(2)} ${CELL / 2} ${CELL / 2})`);
          pathEls[i].style.opacity = "1";
          continue;
        }
        const psi = a * Math.PI;
        const x = act.mid + act.r * Math.cos(psi) + carriage;
        const z = act.r * Math.sin(psi) * Math.abs(Math.sin(psi));
        depth[i] = z;
        const nz = z / rMax;
        const scale = 1 + depthScale * nz;
        const yOrbit = y + z * cameraTilt;
        const flip = settled ? 1 : Math.cos(psi);
        const phaseOff = (settled ? 0 : (1 - Math.cos(psi)) / 2 * Math.PI + glint * Math.sin(psi)) + hov.phase;
        const tilt = (act.glyph.rotation ?? 0) * (settled ? 1 : Math.cos(psi));
        pathEls[i].setAttribute("d", pathForGlyph({ ...act.glyph, width: CELL }, RES, phaseOff));
        pathEls[i].style.opacity = (1 - backDim * Math.max(0, -nz)).toFixed(3);
        outerEls[i].setAttribute(
          "transform",
          `translate(${x.toFixed(2)}, ${yOrbit.toFixed(2)}) translate(${CELL / 2} ${CELL / 2}) scale(${(scale * flip).toFixed(4)} ${scale.toFixed(4)}) translate(${-CELL / 2} ${-CELL / 2})`
        );
        rotEls[i].setAttribute(
          "transform",
          `rotate(${(tilt + hov.rotation).toFixed(2)} ${CELL / 2} ${CELL / 2})`
        );
      }
      const order = actors.map((_, i) => i).sort((p, q) => depth[p] - depth[q]);
      const key = order.join(",");
      if (key !== lastOrder) {
        for (const i of order) svg.appendChild(outerEls[i]);
        lastOrder = key;
      }
    }
    const timeline = { settleAt };
    if (freeze !== null) {
      draw(freeze);
      return { svg, play: () => draw(freeze), stop: () => {
      }, timeline };
    }
    let raf = 0;
    let startMs = null;
    const reduced = typeof window !== "undefined" && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function tick(now) {
      if (startMs === null) startMs = now;
      draw(startSettled || reduced ? settleAt : (now - startMs) / 1e3);
      raf = requestAnimationFrame(tick);
    }
    function play() {
      startMs = null;
      settled = false;
      hovering.fill(false);
      hoverAt.fill(null);
      hoverFrom.forEach((h) => {
        h.phase = 0;
        h.rotation = 0;
      });
      draw(0);
    }
    draw(startSettled ? settleAt : 0);
    raf = requestAnimationFrame(tick);
    return { svg, play, stop: () => cancelAnimationFrame(raf), timeline };
  }

  // js/orbit-runtime.js
  var host = document.getElementById("wordmark");
  mountOrbit(host, { startSettled: true });
})();

    </script>
  </body>
