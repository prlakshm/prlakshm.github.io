<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pond texture lab</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; background: #fff; color: #171717; font: 13px/1.5 ui-monospace, Menlo, monospace; }
      #band { position: relative; overflow: hidden; }
      #band canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #info { padding: 16px; }
      #title { font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
      #blurb { color: #666; max-width: 70ch; }
      #nav { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; }
      #nav a { color: #666; text-decoration: none; }
      #nav a.on { color: #171717; text-decoration: underline; }
      #status { white-space: pre-wrap; color: #b00; padding: 0 16px; }
      body.live #band { width: 100% !important; aspect-ratio: 1440 / 279; height: auto !important; }
      body:not(.live) #info { display: none; }
    </style>
  </head>
  <body>
    <div id="band"><canvas></canvas></div>
    <div id="info">
      <div id="title"></div>
      <div id="blurb"></div>
      <div id="nav"></div>
    </div>
    <div id="status">loading…</div>
    <script>
      if (new URLSearchParams(location.search).has("live")) document.body.classList.add("live");
    </script>
    <script type="module" src="./lab.ts"></script>
  </body>
</html>
