<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Smart Mute · iPhone prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #F5F5F7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; }
  #phone { position: absolute; left: 50%; top: 52px; width: 402px; height: 874px; margin-left: -201px;
    transform: scale(1.3); transform-origin: 50% 0; background: #fff; border-radius: 56px; overflow: hidden;
    box-shadow: 0 0 0 9px #1C1C1E, 0 0 0 10px #3A3A3C, 0 40px 80px rgba(0,0,0,.18); }
  .abs { position: absolute; }
  .island { left: 138px; top: 11px; width: 126px; height: 37px; border-radius: 19px; background: #000; z-index: 20; }
  .time { left: 52px; top: 17px; font: 600 17px/22px -apple-system, system-ui; }
  .pill { background: #fff; border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,.08), 0 0 0 .5px rgba(0,0,0,.04); }
  h1 { position: absolute; left: 18px; top: 108px; font: 700 34px/41px -apple-system, system-ui; letter-spacing: .4px; }
  .row { position: absolute; left: 0; width: 402px; height: 90px; }
  .content { position: absolute; inset: 0; background: #fff; border-radius: 0 30px 30px 0; }
  .av { position: absolute; left: 20px; top: 16px; width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(180deg, #A9B0D6, #7F88BF); color: #fff; font: 600 18px/48px -apple-system, system-ui; text-align: center; }
  .nm { position: absolute; left: 86px; top: 11px; font: 600 17px/22px -apple-system, system-ui; }
  .tm { position: absolute; right: 40px; top: 12px; font: 400 15px/20px -apple-system, system-ui; color: #8A8A8E; }
  .chev { position: absolute; right: 20px; top: 16px; }
  .pv { position: absolute; left: 86px; top: 36px; font: 400 15px/20px -apple-system, system-ui; color: #8A8A8E;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sep { position: absolute; left: 86px; right: 0; bottom: 0; height: .5px; background: #E2E2E6; }
  .act { position: absolute; top: 19.25px; width: 51.5px; height: 51.5px; border-radius: 26px; color: #fff;
    display: flex; align-items: center; justify-content: center; }
  .badge { position: absolute; right: 20px; top: 38.5px; color: #CBCBCE; }
  .finger { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
    background: rgba(28,28,30,.32); z-index: 30; }
  .banner { position: absolute; left: 10px; top: 0; width: 382px; border-radius: 26px; z-index: 25;
    background: rgba(250,250,252,.96); box-shadow: 0 10px 34px rgba(0,0,0,.16), 0 0 0 .5px rgba(0,0,0,.06); padding: 13px 16px 14px 62px; }
  .appicon { position: absolute; left: 14px; top: 14px; width: 38px; height: 38px; border-radius: 9px;
    background: linear-gradient(180deg, #5BF675, #0CBD2A); display: flex; align-items: center; justify-content: center; }
  .caption { position: absolute; left: 0; right: 0; top: 1218px; text-align: center; font: 600 34px/42px -apple-system, system-ui; color: #1D1D1F; }
  .sub { position: absolute; left: 0; right: 0; top: 1266px; text-align: center; font: 400 22px/28px -apple-system, system-ui; color: #86868B; }
</style>
</head>
<body>
<div id="stage">
  <div id="phone">
    <div class="abs island"></div>
    <div class="abs time">9:41</div>
    <svg class="abs" style="right:30px;top:22px" width="78" height="14" viewBox="0 0 78 14"><rect x="0" y="9" width="3.2" height="4" rx="1"/><rect x="4.8" y="6.5" width="3.2" height="6.5" rx="1"/><rect x="9.6" y="4" width="3.2" height="9" rx="1"/><rect x="14.4" y="1" width="3.2" height="12" rx="1"/><path d="M31 3.6C34.6 3.6 37.8 5 40.2 7.3L38.5 9C36.6 7.2 33.9 6 31 6C28.1 6 25.4 7.2 23.5 9L21.8 7.3C24.2 5 27.4 3.6 31 3.6ZM31 7.4C32.9 7.4 34.6 8.1 35.9 9.3L34.2 11C33.4 10.2 32.2 9.8 31 9.8C29.8 9.8 28.6 10.2 27.8 11L26.1 9.3C27.4 8.1 29.1 7.4 31 7.4ZM31 11.2C31.8 11.2 32.4 11.5 32.9 11.9L31 13.8L29.1 11.9C29.6 11.5 30.2 11.2 31 11.2Z"/><rect x="47" y="1" width="25" height="12" rx="3.6" fill="none" stroke="#000" stroke-opacity=".4"/><rect x="49" y="3" width="17" height="8" rx="2"/><rect x="73.5" y="4.5" width="1.6" height="5" rx=".8" fill-opacity=".4"/></svg>
    <div class="abs pill" style="left:16px;top:56px;width:78px;height:48px;font:400 17px/48px -apple-system,system-ui;text-align:center">Edit</div>
    <div class="abs pill" style="right:16px;top:56px;width:48px;height:48px;display:flex;align-items:center;justify-content:center"><svg width="22" height="16" viewBox="0 0 22 16"><path d="M2 2H20M5 8H17M8.5 14H13.5" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg></div>
    <h1>Messages</h1>
    <div id="rows"></div>
    <div class="abs pill" style="left:16px;bottom:34px;width:310px;height:52px">
      <svg class="abs" style="left:18px;top:16px" width="20" height="20" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="#000" stroke-width="2.2"/><path d="M13 13L18 18" stroke="#000" stroke-width="2.4" stroke-linecap="round"/></svg>
      <div class="abs" style="left:48px;top:15px;font:400 17px/22px -apple-system,system-ui;color:rgba(60,60,67,.7)">Search</div>
      <svg class="abs" style="right:20px;top:15px" width="14" height="22" viewBox="0 0 14 22"><rect x="3.5" y="1" width="7" height="12" rx="3.5" fill="none" stroke="#000" stroke-width="1.8"/><path d="M1 10C1 13.3 3.7 16 7 16C10.3 16 13 13.3 13 10M7 16V20.5" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <div class="abs pill" style="right:16px;bottom:34px;width:52px;height:52px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M11 4H6C4.9 4 4 4.9 4 6V18C4 19.1 4.9 20 6 20H18C19.1 20 20 19.1 20 18V13" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/><path d="M17.5 3.5L20.5 6.5L12.5 14.5L9 15L9.5 11.5Z" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/></svg></div>
    <div class="abs" style="left:131px;bottom:8px;width:140px;height:5px;border-radius:3px;background:#000"></div>
    <div class="banner" id="banner">
      <div class="appicon"><svg width="24" height="22" viewBox="0 0 24 22"><path d="M12 1C5.9 1 1 5.1 1 10.1C1 12.9 2.5 15.4 4.9 17.1C4.7 18.6 3.9 19.9 2.8 20.8C5 20.8 7 20 8.4 18.8C9.5 19.1 10.7 19.2 12 19.2C18.1 19.2 23 15.1 23 10.1C23 5.1 18.1 1 12 1Z" fill="#fff"/></svg></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font:600 15px/20px -apple-system,system-ui">Roomies</span>
        <span style="font:400 13px/18px -apple-system,system-ui;color:#8A8A8E">now</span>
      </div>
      <div id="reason" style="display:flex;align-items:center;gap:5px;margin-top:1px;color:#5E5CE6;font:600 13px/18px -apple-system,system-ui"></div>
      <div style="font:400 15px/20px -apple-system,system-ui;margin-top:1px">Maya: dinner moved to 8 tonight, can everyone still make it?</div>
    </div>
    <div class="finger" id="finger"></div>
  </div>
  <div class="caption" id="cap"></div>
  <div class="sub" id="sub"></div>
</div>
<script src="icons.js"></script>
<script>
const { seg, out, inOut, spring, lerp, clamp } = TL;
const ROWS = [
  ["Roomies","RM","Priya: ok who left the oven on lol. also is anyone home tonight?","9:41 AM"],
  ["Mom","M","Call me when you land, love you","9:12 AM"],
  ["Book Club","BC","Maya: chapter 7 was wild, no spoilers in here pls","Yesterday"],
  ["Jamie Kim","JK","haha yes, see you then!","Yesterday"],
  ["Dad","D","Sent the photos from Sunday","Wednesday"],
  ["Alex Rivera","AR","You loved “that’s perfect”","Tuesday"],
  ["Sam Ortiz","SO","Running 5 min late","Monday"],
];
const CHEV = '<svg width="8" height="14" viewBox="0 0 8 14"><path d="M1.5 1.5L6.5 7L1.5 12.5" fill="none" stroke="#C4C4C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
document.getElementById("rows").innerHTML = ROWS.map((r, i) => `
  <div class="row" style="top:${166 + i * 90}px" id="row${i}">
    ${i === 0 ? `
      <div class="act" id="a0" style="left:216px;background:#8E8DF0">${ICONS.smartMute(24, true)}</div>
      <div class="act" id="a1" style="left:278px;background:#5E5CE6">${ICONS.bellSlash(24, true)}</div>
      <div class="act" id="a2" style="left:340px;background:#FF3B30">${ICONS.trash(24, true)}</div>` : ""}
    <div class="content" id="c${i}">
      <div class="av" style="${r[1].length < 2 ? "font-size:20px" : ""}">${r[1]}</div>
      <div class="nm">${r[0]}</div>
      <div class="tm" id="tm${i}">${r[3]}</div>
      <div class="chev">${CHEV}</div>
      <div class="pv" id="pv${i}" style="width:296px">${r[2]}</div>
      ${i === 0 ? `<div class="badge" id="badge">${ICONS.smartMute(16.5, true)}</div>` : ""}
      <div class="sep" id="sep${i}"></div>
    </div>
  </div>`).join("");
document.getElementById("reason").innerHTML = ICONS.sparkle(11) + "Plan changed";

const $ = (id) => document.getElementById(id);
const BEATS = [
  [0, "Swipe the loud group chat", "Smart Mute sits first, before Hide Alerts and Delete"],
  [1.55, "Tap Smart Mute", "One tap, the defaults are already set"],
  [2.42, "The badge says it’s on", "Where the mute bell sits today"],
  [3.05, "Banter arrives quietly", "No banner, no buzz"],
  [5.0, "Plans get through", "With the reason it pinged you"],
];
const DURATION = 9.2;

function render(t) {
  // swipe open, tap, close
  const open = out(seg(t, 0.75, 1.3));
  const close = inOut(seg(t, 2.1, 2.5));
  const off = -197 * open * (1 - close);
  $("c0").style.transform = `translateX(${off}px)`;
  $("c0").style.background = open > 0 && close < 1 ? `rgb(${lerp(255,233,Math.min(1,open*3)*(1-close))},${lerp(255,233,Math.min(1,open*3)*(1-close))},${lerp(255,238,Math.min(1,open*3)*(1-close))})` : "#fff";
  $("sep0").style.opacity = off < -2 ? 0 : 1;
  [2, 1, 0].forEach((k, n) => {
    const s = spring(t - (0.84 + n * 0.09)) * (1 - close);
    const press = 1; // no pressed state: the tap just collapses the row
    const el = $("a" + k);
    el.style.transform = `scale(${Math.max(0, s) * press})`;
    el.style.opacity = clamp(s * 1.6);
  });
  // badge + narrower preview
  const b = t < 2.42 ? 0 : spring(t - 2.42, 14, 0.24);
  $("badge").style.transform = `scale(${0.3 + 0.7 * b})`;
  $("badge").style.opacity = clamp(b * 1.5);
  $("pv0").style.width = (t < 2.42 ? 296 : 271) + "px";
  // incoming messages
  if (t >= 5.05) { $("pv0").textContent = "Maya: dinner moved to 8 tonight, can everyone still make it?"; $("tm0").textContent = "9:43 AM"; }
  else if (t >= 4.25) { $("pv0").textContent = "Sam: I’m crying at the toast"; $("tm0").textContent = "9:42 AM"; }
  else if (t >= 3.7) { $("pv0").textContent = "Priya: the toast is innocent"; $("tm0").textContent = "9:42 AM"; }
  else if (t >= 3.15) { $("pv0").textContent = "Leo: lmaooo it was the toast again"; $("tm0").textContent = "9:42 AM"; }
  else { $("pv0").textContent = ROWS[0][2]; $("tm0").textContent = "9:41 AM"; }
  const flash = [3.15, 3.7, 4.25].reduce((a, at) => a + Math.max(0, 1 - Math.abs(t - at - 0.1) / 0.25) * (t > at ? 1 : 0), 0) + Math.max(0, 1 - Math.abs(t - 5.15) / 0.25) * (t > 5 ? 1 : 0);
  $("pv0").style.color = `rgb(${lerp(138,60,flash)},${lerp(138,60,flash)},${lerp(142,67,flash)})`;
  // banner
  const bin = t < 5.15 ? 0 : spring(t - 5.15, 12, 0.2);
  const bout = inOut(seg(t, 7.5, 7.85));
  const by = lerp(-150, 54, bin) - 210 * bout;
  $("banner").style.transform = `translateY(${by}px) scale(${lerp(0.94, 1, bin)})`;
  $("banner").style.opacity = t < 5.15 ? 0 : 1;
  // finger
  const f = $("finger");
  let fx = 345, fy = 211, fo = 0, fs = 1;
  if (t < 1.4) {
    fo = seg(t, 0.45, 0.65) * (1 - seg(t, 1.3, 1.45));
    fx = lerp(345, 168, out(seg(t, 0.75, 1.3)));
  } else if (t < 2.5) {
    const m = inOut(seg(t, 1.55, 1.95));
    fx = lerp(205, 233, m); fy = lerp(300, 228, m);
    fo = seg(t, 1.5, 1.65) * (1 - seg(t, 2.1, 2.25));
    fs = 1 - 0.15 * Math.sin(Math.PI * seg(t, 1.98, 2.12));
  }
  f.style.left = fx + "px"; f.style.top = fy + "px"; f.style.opacity = fo; f.style.transform = `scale(${fs})`;
  // captions
  let bi = 0; BEATS.forEach((x, i) => { if (t >= x[0]) bi = i; });
  const since = t - BEATS[bi][0];
  $("cap").textContent = BEATS[bi][1]; $("sub").textContent = BEATS[bi][2];
  const co = bi === 0 ? 1 : clamp(since / 0.25);
  $("cap").style.opacity = co; $("sub").style.opacity = co;
  $("cap").style.transform = $("sub").style.transform = `translateY(${(1 - out(clamp(since / 0.35))) * (bi ? 10 : 0)}px)`;
}
window.render = render; window.DURATION = DURATION;
if (!location.search.includes("record")) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % (DURATION + 0.6)); requestAnimationFrame(loop); })();
} else render(0);
</script>
</body>
</html>
