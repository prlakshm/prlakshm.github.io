<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Banner concepts</title>
<style>
  @font-face { font-family: "General Sans"; src: url(GeneralSans-Variable.woff2) format("woff2"); font-weight: 200 700; }
  @font-face { font-family: "JB Mono"; src: url(JetBrainsMono-Variable.woff2) format("woff2"); font-weight: 100 800; }
  html, body { margin: 0; background: #222; }
  .frame { position: relative; overflow: hidden; background: #f8fafc; }
  .abs { position: absolute; }
  .door { position: absolute; inset: 0;
    background:
      linear-gradient(100deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.55) 46%, rgba(255,255,255,0) 60%),
      linear-gradient(180deg, #f4f5f3 0%, #e9ebe8 100%); }
  .m { position: absolute; background: #fdfdfb; color: #141414; white-space: nowrap;
    font: 400 40px/1 "Times New Roman", Times, serif; padding: 8px 12px 7px;
    box-shadow: 0 1px 0 rgba(0,0,0,.06), 1px 2px 2px rgba(0,0,0,.18), 3px 6px 10px rgba(0,0,0,.16); }
  .print { position: absolute; box-shadow: 1px 2px 3px rgba(0,0,0,.18), 4px 10px 20px rgba(0,0,0,.16); }
  .print img { display: block; width: 100%; height: 100%; }
  .dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; left: 50%; top: -6px; margin-left: -11px;
    box-shadow: 0 2px 3px rgba(0,0,0,.35), inset 0 -3px 4px rgba(0,0,0,.18), inset 0 3px 4px rgba(255,255,255,.6); }
  /* gallery wall */
  .wall { position: absolute; inset: 0; background: linear-gradient(180deg, #f6f4f0, #eeebe5); }
  .framed { position: absolute; background: #fff; padding: 12px; border: 5px solid #1b1b1b;
    box-shadow: 0 2px 3px rgba(0,0,0,.15), 0 14px 26px rgba(0,0,0,.14); }
  .framed img { display: block; width: 100%; height: 100%; }
  .vinyl { position: absolute; font: 500 46px/1.05 "General Sans"; letter-spacing: -.02em; color: #1b1b1b; }
  .vinyl small { display: block; margin-top: 14px; font: 500 16px/1 "JB Mono"; letter-spacing: .08em; color: #666; text-transform: uppercase; }
  /* masked title */
  .mask { position: absolute; font: 700 150px/1 "General Sans"; letter-spacing: -.035em; white-space: nowrap;
    background: url(skyline-d.webp) center 75% / cover; -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { position: absolute; font: 500 17px/1 "JB Mono"; letter-spacing: .1em; text-transform: uppercase; color: #666; }
  .guide { position: absolute; border-radius: 50%; border: 3px dashed #ff2d55; background: rgba(255,45,85,.12); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search);
const v = q.get("v") || "F";
const li = (q.get("size") || "li") === "li";
const guides = q.get("guides") === "1";
const [W, H] = li ? [1584, 396] : [1500, 500];
const P = ["surprise-rail", "mixr", "pinnables", "figma-sound", "codex-bookmarks"].map(n => n + "-poster.webp");
const f = document.createElement("div"); f.className = "frame";
f.style.width = W + "px"; f.style.height = H + "px";
document.getElementById("root").appendChild(f);
const el = (cls, css = {}, html = "") => { const e = document.createElement("div"); e.className = cls; Object.assign(e.style, css); e.innerHTML = html; f.appendChild(e); return e; };
const px = n => Math.round(n) + "px";

if (v === "F") {
  // fridge door: the posters as prints held up by magnets; word magnets top-left, above the avatar
  el("door");
  const h = li ? 250 : 262, w = h * 0.8, gap = li ? 26 : 20;
  const x0 = W - (5 * w + 4 * gap) - (li ? 56 : 44);
  const rot = [-3, 2, -1.5, 3, -2], dy = [6, -4, 10, -2, 4];
  const dots = ["#e8433a", "#f2c230", "#2f6fe0", "#28a46b", "#f08fb0"];
  P.forEach((src, i) => {
    const p = el("print", { left: px(x0 + i * (w + gap)), top: px((H - h) / 2 + dy[i]), width: px(w), height: px(h), transform: `rotate(${rot[i]}deg)` }, `<img src="${src}">`);
    const d = document.createElement("div"); d.className = "dot"; d.style.background = dots[i]; p.appendChild(d);
  });
  const ys = li ? [26, 102, 168] : [44, 136, 222];
  [["product designer", -2, 0], ["nyc", 3, 130], ["pranaviram.com", -1, 14]].forEach(([t, r, dx], i) => {
    const m = el("m", { left: px((li ? 44 : 48) + dx), top: px(ys[i]), transform: `rotate(${r}deg)` }, t);
    m.style.fontSize = li ? "36px" : "36px";
  });
}

if (v === "G") {
  // gallery wall: salon-hung framed posters, wall lettering top-left
  el("wall");
  const Hb = li ? 320 : 330, top = (H - Hb) / 2, fr = 34; // fr = frame + mat added to each side total
  const hang = [ // [poster, x, y, h] in units of Hb (x before frame allowance)
    [0, 0, .12, .70], [1, .56, 0, .45], [2, .56, .53, .47], [3, .94, .06, .84], [4, 1.62, .16, .60],
  ];
  const n = [0, 1, 1, 2, 3]; // frames to the left of each piece
  const boxes = hang.map(([i, x, y, h], k) => { const hh = h * Hb - fr; return [i, x * Hb + n[k] * 22, top + y * Hb, hh * 0.8 + 34, hh]; });
  const right = Math.max(...boxes.map(b => b[1] + b[3]));
  const left = W - right - (li ? 56 : 48);
  boxes.forEach(([i, x, y, w, hh]) => el("framed", { left: px(left + x), top: px(y), width: px(w - 34), height: px(hh) }, `<img src="${P[i]}">`));
  el("vinyl", { left: px(li ? 48 : 56), top: px(li ? 40 : 60) }, "product designer<br>in nyc<small>pranaviram.com</small>");
}

if (v === "M") {
  // the Home hero's masked title: lettering filled with the skyline painting
  const t = el("mask", { left: px(li ? 400 : 400), top: px(li ? 56 : 90) }, "product<br>designer");
  t.style.fontSize = li ? "136px" : "160px"; t.style.lineHeight = ".9";
  el("sub", { left: px(li ? 408 : 410), top: px(li ? 326 : 412) }, "nyc · pranaviram.com");
}

if (guides) {
  const [cx, cy, r] = li ? [200, 396, 152] : [205, 500, 168];
  el("guide", { left: px(cx - r), top: px(cy - r), width: px(2 * r), height: px(2 * r) });
}
</script>
</body>
</html>
