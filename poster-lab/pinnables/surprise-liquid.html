<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Surprise Rail — liquid metal</title>
<link href="fonts-google/fonts.css" rel="stylesheet">
<style>
  html,body{margin:0;background:#000}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script>
/* Surprise Rail poster — liquid metal.
   ?v=A..E   variation            ?seed=N
   A logo    clean chrome, sparkle tucked behind-right, lavender haze
   B melt    the letters liquify and run; sparkle softens with them
   C pool    chrome droplets scattered round the mark
   D sky     iridescent cloud ground, the chrome mirrors it
   E halo    one huge sparkle behind, mark in front, editorial labels
   Palette: the rail's own iridescent styles from the case study —
   #EDEFE5 pearl · #E6D5E8 · #BEA6BF mauve · #AFBECF · #979AB1 · #8C95BE */
const qs = new URLSearchParams(location.search);
const V = (qs.get('v') || 'A').toUpperCase();
const SEED = +(qs.get('seed') ?? 7);
const W = 1600, H = 2000;
const cv = document.getElementById('gl'); cv.width = W; cv.height = H;
const gl = cv.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });

const FAT = +(qs.get('fat') ?? 0.035);
const WARP = +(qs.get('warp') ?? 0.06);
const FONT_HBO = qs.get('fhbo') || "'Fredoka'";
const FONT_MAX = qs.get('fmax') || "'Baloo 2'";
const WT_HBO = qs.get('whbo') || 700, WT_MAX = qs.get('wmax') || 800;

// ---------- masks (2D canvas) ----------
function liquify(c, amp, scale, seed) {
  const g = 64; const grid = new Float32Array(g * g * 2);
  let r = seed * 7919 + 1; const rn = () => { r = (r * 9301 + 49297) % 233280; return r / 233280; };
  for (let i = 0; i < grid.length; i++) grid[i] = rn() - .5;
  const smooth = t => t * t * (3 - 2 * t);
  const nz = (x, y, ch) => {
    const fx = x / scale, fy = y / scale; const ix = Math.floor(fx), iy = Math.floor(fy);
    const tx = smooth(fx - ix), ty = smooth(fy - iy);
    const at = (a, b) => grid[(((b % g) + g) % g * g + ((a % g) + g) % g) * 2 + ch];
    return (at(ix, iy) * (1 - tx) + at(ix + 1, iy) * tx) * (1 - ty) + (at(ix, iy + 1) * (1 - tx) + at(ix + 1, iy + 1) * tx) * ty;
  };
  const x = c.getContext('2d'); const src = x.getImageData(0, 0, W, H).data;
  const out = x.createImageData(W, H); const d = out.data;
  for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) {
    const dx = nz(xx, y, 0) * amp + nz(xx * 3.1, y * 3.1, 1) * amp * .25;
    const dy = nz(xx + 400, y + 900, 1) * amp + nz(xx * 3.1 + 7, y * 3.1, 0) * amp * .25;
    const sx = Math.min(W - 1, Math.max(0, Math.round(xx + dx))), sy = Math.min(H - 1, Math.max(0, Math.round(y + dy)));
    const i = (y * W + xx) * 4, j = (sy * W + sx) * 4;
    d[i] = src[j]; d[i + 1] = src[j + 1]; d[i + 2] = src[j + 2]; d[i + 3] = src[j + 3];
  }
  x.putImageData(out, 0, 0);
}
function layer() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

function drawMark(ctx, cx, cy, size, melt) {
  // HBO — the O as the ring, like the lettermark
  ctx.save();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round'; ctx.lineWidth = size * FAT;
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.font = `${WT_HBO} ${size}px ${FONT_HBO}`;
  const hb = ctx.measureText('HB');
  const stem = size * 0.20 + size * FAT;
  const cap = size * 0.71 + size * FAT;
  const r = cap / 2;
  const gap = size * 0.06;
  const wHBO = hb.width + gap + r * 2;
  const x0 = cx - wHBO / 2;
  const yHBO = cy - size * 0.10;
  ctx.fillText('HB', x0, yHBO); if (FAT) ctx.strokeText('HB', x0, yHBO);
  const ox = x0 + hb.width + gap + r, oy = yHBO - cap / 2;
  ctx.lineWidth = stem; ctx.beginPath(); ctx.arc(ox, oy, r - stem / 2, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = stem * 0.55; ctx.beginPath(); ctx.arc(ox, oy, r * 0.36, 0, Math.PI * 2); ctx.stroke();
  // max — lowercase, set to the same width
  ctx.font = `${WT_MAX} ${size}px ${FONT_MAX}`;
  let mw = ctx.measureText('max').width;
  const s2 = (wHBO / mw) * size;
  ctx.font = `${WT_MAX} ${s2}px ${FONT_MAX}`;
  mw = ctx.measureText('max').width;
  const ym = yHBO + s2 * (V === 'D' ? 0.50 : 0.62); ctx.fillText('max', cx - mw / 2, ym); if (FAT) { ctx.lineWidth = size * FAT; ctx.strokeText('max', cx - mw / 2, ym); }
  ctx.restore();
  return { top: yHBO - cap, bottom: yHBO + s2 * 0.62, left: x0, right: x0 + wHBO };
}

function sparklePath(ctx, cx, cy, R, k = 0.16, rot = 0) {
  ctx.beginPath();
  const tips = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const c = Math.cos(rot), s = Math.sin(rot);
  const P = (x, y) => [cx + (x * c - y * s) * R, cy + (x * s + y * c) * R];
  let p = P(0, -1); ctx.moveTo(p[0], p[1]);
  for (let i = 0; i < 4; i++) {
    const a = tips[i], b = tips[(i + 1) % 4];
    const q = P((a[0] + b[0]) * k, (a[1] + b[1]) * k);
    const e = P(b[0], b[1]);
    ctx.quadraticCurveTo(q[0], q[1], e[0], e[1]);
  }
  ctx.closePath();
}

// seeded noise for the melt / droplets
let rs = SEED * 9301 + 49297; const rnd = () => { rs = (rs * 9301 + 49297) % 233280; return rs / 233280; };

let texText, texSpark, texDrops, box;
const SOFT = +(qs.get('soft') ?? 0.3);
function build() {
const text = layer(), spark = layer(), drops = layer();
const size = +(qs.get('size') ?? 400);
const markY = H * +(qs.get('y') ?? 0.53); const MX = +(qs.get('x') ?? 0.47);
{ const t = text.getContext('2d');
  if (qs.has('tilt')) { t.translate(W / 2, markY); t.rotate(-0.10); t.translate(-W / 2, -markY); }
  box = drawMark(t, W * MX, markY, size, false);
  t.setTransform(1, 0, 0, 1, 0, 0);
  if (WARP) liquify(text, size * WARP, size * 1.3, SEED);
  if (V === 'D') {
    // melt: slice the mark into columns and let each run downward by a
    // smooth random amount, more toward the bottom edge of each letter
    const src = document.createElement('canvas'); src.width = W; src.height = H;
    src.getContext('2d').drawImage(text, 0, 0);
    t.clearRect(0, 0, W, H);
    const cols = 1600, ph = rnd() * 10;
    for (let x = 0; x < W; x++) {
      const n = Math.sin(x * 0.021 + ph) * 0.5 + Math.sin(x * 0.047 + ph * 2.1) * 0.3 + Math.sin(x * 0.0085 + ph * 0.7) * 0.6;
      const stretch = 1 + Math.max(0, n) * 0.32;   // runs down, never up
      const sh = H - box.top;
      t.drawImage(src, x, box.top, 1, sh, x, box.top, 1, sh * stretch);
    }
    // a few drips
    t.fillStyle = '#fff';
    for (let i = 0; i < 6; i++) {
      const x = box.left + rnd() * (box.right - box.left), w = 44 + rnd() * 50, len = 80 + rnd() * 240;
      t.beginPath(); t.roundRect(x - w / 2, box.bottom - 40, w, len, w / 2); t.fill();
      t.beginPath(); t.arc(x, box.bottom - 40 + len, w * 0.72, 0, Math.PI * 2); t.fill();
    }
  }
}
{ const s = spark.getContext('2d'); s.fillStyle = '#fff';
  // bubble sparkle: fuller sides, and a fat round stroke so the tips are blunt
  s.strokeStyle = '#fff'; s.lineJoin = 'round'; s.lineCap = 'round';
  const SR = +(qs.get('sr') ?? 280), SX = +(qs.get('sx') ?? 0.86), SY = +(qs.get('sy') ?? 0.43);
  sparklePath(s, W * SX, H * SY, SR, +(qs.get('sk') ?? 0.26), 0.0); s.lineWidth = SR * 0.16; s.stroke(); s.fill();
  sparklePath(s, W * 0.90, H * 0.66, SR * 0.26, 0.3, 0.2); s.lineWidth = SR * 0.05; s.stroke(); s.fill();
  if (WARP) liquify(spark, SR * 0.10, SR * 1.2, SEED + 3);
}
if (V === 'E') {
  const d = drops.getContext('2d'); d.fillStyle = '#fff';
  // metaballs: blurred discs, thresholded in the shader (channel b)
  d.filter = 'blur(22px)';
  for (let i = 0; i < 60; i++) {
    const x = 100 + rnd() * (W - 200), y = 140 + rnd() * (H - 280);
    if (x > box.left - 30 && x < box.right + 30 && y > box.top - 40 && y < box.bottom + 40) continue;
    const n = 1 + Math.floor(rnd() * 3);
    for (let j = 0; j < n; j++) { const r = 14 + rnd() * 46; d.beginPath(); d.ellipse(x + (rnd() - .5) * 150, y + (rnd() - .5) * 110, r * (1 + rnd()), r, rnd() * 3, 0, Math.PI * 2); d.fill(); }
  }
}

// height from a true distance field (float, so the chrome has no contour
// banding): r,g = 16-bit dome height, b = sharp mask
function edt1d(f, n, out, v, z) {
  let k = 0; v[0] = 0; z[0] = -Infinity; z[1] = Infinity;
  for (let q = 1; q < n; q++) {
    let s;
    while (true) {
      const vk = v[k];
      s = ((f[q] + q * q) - (f[vk] + vk * vk)) / (2 * q - 2 * vk);
      if (s <= z[k]) { k--; if (k < 0) { k = 0; break; } } else break;
    }
    if (k === 0 && s <= z[0]) { v[0] = q; z[0] = -Infinity; z[1] = Infinity; continue; }
    k++; v[k] = q; z[k] = s; z[k + 1] = Infinity;
  }
  k = 0;
  for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; const d = q - v[k]; out[q] = d * d + f[v[k]]; }
}
// droplets: blurred discs thresholded, so neighbours merge like mercury
function dropsMask(c) { const o = layer(); const x = o.getContext('2d');
  const id = c.getContext('2d').getImageData(0, 0, W, H); const d = id.data;
  for (let i = 0; i < W * H; i++) d[i * 4 + 3] = d[i * 4 + 3] > 92 ? 255 : 0;
  x.putImageData(id, 0, 0); return o; }
function pack(src, R) {
  const id = src.getContext('2d').getImageData(0, 0, W, H).data;
  const INF = 1e12;
  const f = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) f[i] = id[i * 4 + 3] > 127 ? INF : 0;
  const tmp = new Float32Array(W * H);
  const n = Math.max(W, H), col = new Float32Array(n), out = new Float32Array(n), v = new Int32Array(n), z = new Float32Array(n + 1);
  for (let x = 0; x < W; x++) { for (let y = 0; y < H; y++) col[y] = f[y * W + x]; edt1d(col, H, out, v, z); for (let y = 0; y < H; y++) tmp[y * W + x] = out[y]; }
  for (let y = 0; y < H; y++) { edt1d(tmp.subarray(y * W, y * W + W), W, out, v, z); for (let x = 0; x < W; x++) f[y * W + x] = out[x]; }
  const hgt = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) { const t = Math.min(Math.sqrt(f[i]) / R, 1); hgt[i] = Math.sqrt(1 - (1 - t) * (1 - t)); }
  // soften the ridges where the domes meet: three box blurs ≈ a gaussian,
  // so the surface pools instead of creasing
  const br = Math.max(2, Math.round(R * SOFT));
  const t2 = new Float32Array(W * H);
  const box = (src, dst, horiz) => {
    const n = horiz ? W : H, m = horiz ? H : W;
    for (let j = 0; j < m; j++) {
      let acc = 0; const at = i => horiz ? j * W + i : i * W + j;
      for (let i = -br; i <= br; i++) acc += src[at(Math.min(n - 1, Math.max(0, i)))];
      for (let i = 0; i < n; i++) {
        dst[at(i)] = acc / (2 * br + 1);
        acc += src[at(Math.min(n - 1, i + br + 1))] - src[at(Math.max(0, i - br))];
      }
    }
  };
  for (let k = 0; k < 3; k++) { box(hgt, t2, true); box(t2, hgt, false); }
  const px = new Uint8Array(W * H * 4);
  for (let i = 0; i < W * H; i++) {
    const q = Math.round(Math.min(1, hgt[i]) * 65535);
    // b = the anti-aliased silhouette, a = distance to the rim (0..R)
    px[i * 4] = q >> 8; px[i * 4 + 1] = q & 255; px[i * 4 + 2] = id[i * 4 + 3]; px[i * 4 + 3] = Math.round(Math.min(1, Math.sqrt(f[i]) / R) * 255);
  }
  return px;
}
texText = pack(text, +(qs.get('rt') ?? size * 0.17)); texSpark = pack(spark, +(qs.get('rs') ?? 120)); texDrops = pack(dropsMask(drops), 40);
}

// ---------- GL ----------
const vs = `attribute vec2 p; varying vec2 v; void main(){ v = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;
const fs = `
precision highp float;
varying vec2 v;
uniform sampler2D uText, uSpark, uDrops;
uniform vec2 uRes; uniform float uVar, uSeed, uTime, uRelT, uRelS;

vec3 hex(float r, float g, float b){ return vec3(r, g, b) / 255.; }
#define PEARL hex(237.,239.,229.)
#define LILAC hex(230.,213.,232.)
#define MAUVE hex(190.,166.,191.)
#define SKY   hex(175.,190.,207.)
#define SLATE hex(151.,154.,177.)
#define PERI  hex(140.,149.,190.)

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
float fbm(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 5; i++){ s += a * noise(p); p = p * 2.03 + 17.1; a *= .5; } return s; }

// the chrome environment: bands of black, pearl and the rail's tints,
// read by the reflected normal. t runs -1 (floor) .. 1 (sky)
vec3 sat(vec3 c, float k){ float l = dot(c, vec3(.299, .587, .114)); return mix(vec3(l), c, k); }
// the rail's iridescent banner gradient
vec3 irid(float t){
  vec3 c = MAUVE;
  c = mix(c, PEARL, smoothstep(.0, .17, t));
  c = mix(c, LILAC, smoothstep(.17, .30, t));
  c = mix(c, SLATE, smoothstep(.30, .56, t));
  c = mix(c, PEARL, smoothstep(.56, .91, t));
  c = mix(c, SKY, smoothstep(.91, 1.0, t));
  return c;
}

// chrome environment, read by the reflected normal: t = -1 floor .. 1 sky.
// Bright sky, a soft grey horizon, a dark floor — the reference's room.
vec3 env(float t, float x){
  float k = t * .5 + .5;
  vec3 c = vec3(.06, .065, .08);
  c = mix(c, vec3(.22, .24, .27), smoothstep(.12, .30, k));
  c = mix(c, vec3(.78, .80, .84), smoothstep(.34, .44, k));
  c = mix(c, vec3(1.00), smoothstep(.46, .54, k));
  c = mix(c, vec3(.90, .91, .94), smoothstep(.56, .64, k));
  c = mix(c, vec3(.45, .48, .53), smoothstep(.66, .74, k));
  c = mix(c, vec3(.97), smoothstep(.78, .88, k));
  c = mix(c, vec3(.80, .82, .86), smoothstep(.92, 1.0, k));
  // a dark pillar off to the left, a lighter one to the right
  c = mix(c, vec3(.10, .11, .13), smoothstep(-.35, -.95, x) * .8);
  c = mix(c, vec3(.98), smoothstep(.55, .95, x) * .35);
  c *= .9 + .2 * fbm(vec2(x * .8 + uSeed, t * .9));
  return c;
}

float hgt(sampler2D t, vec2 uv){ vec4 m = texture2D(t, uv); return (m.r * 255. * 256. + m.g * 255.) / 65535.; }
vec3 shade(sampler2D tex, vec2 uv, float relief, float wobble, vec3 surround, out float inside){
  vec2 px = 1. / uRes;
  vec4 m0 = texture2D(tex, uv); inside = m0.b;
  float h0 = hgt(tex, uv);
  float dx = hgt(tex, uv + vec2(px.x * 2., 0.)) - hgt(tex, uv - vec2(px.x * 2., 0.));
  float dy = hgt(tex, uv + vec2(0., px.y * 2.)) - hgt(tex, uv - vec2(0., px.y * 2.));
  vec2 rp = uv * vec2(uRes.x / uRes.y, 1.) * 3.5 + uSeed;
  float r1 = fbm(rp), r2 = fbm(rp + vec2(5.2, 1.3));
  vec3 n = normalize(vec3(-dx * relief + (r1 - .5) * wobble, dy * relief + (r2 - .5) * wobble, 1.));
  vec3 r = reflect(vec3(0., 0., -1.), n);
  vec3 col = env(r.y, r.x);
  // the metal also mirrors whatever colour surrounds it, faintly
  col = mix(col, col * (surround * 1.6 + .4), .22);
  // the key light, high on the left: tops shine, undersides fall dark
  vec3 L = normalize(vec3(-.45, .85, .45));
  float dif = max(dot(n, L), 0.);
  col *= .5 + .6 * dif;
  col += pow(max(dot(normalize(L + vec3(0., 0., 1.)), n), 0.), 70.) * 1.0;
  // a second, cooler glint from the lower right
  col += pow(max(dot(normalize(vec3(.6, -.5, 1.)), n), 0.), 120.) * .5;
  // fresnel: the body brightens as it turns away
  float fr = pow(1. - n.z, 3.);
  col = mix(col, vec3(.97, .98, 1.), fr * .8);
  // the double contour: a dark line just inside a bright lip
  col = mix(col, vec3(.09, .10, .12), smoothstep(.02, .06, m0.a) * (1. - smoothstep(.06, .13, m0.a)) * .75);
  col = mix(col, vec3(1.), (1. - smoothstep(.0, .03, m0.a)) * .95);
  return col;
}

void main(){
  vec2 uv = vec2(v.x, 1. - v.y);
  float asp = uRes.x / uRes.y;
  vec2 q = (uv - .5) * vec2(asp, 1.);
  vec3 bg = vec3(.016, .016, .02);

  // ground
  float grain = hash(uv * uRes + uSeed) - .5;
  vec3 surround = vec3(.0);
  float diag = clamp((uv.x * .7 + uv.y * .9) * .62 + fbm(uv * 2. + uSeed) * .18 - .05, 0., 1.);
  if (uVar == 1. || uVar == 4.) {
    // sky: the whole sheet is the rail's gradient, softened like a dawn
    bg = sat(irid(diag), 1.6) * .92;
    bg = mix(bg, bg * vec3(.86, .84, .92), fbm(uv * 3.5 + 3.) * .6);
    surround = bg;
  } else if (uVar == 2.) {
    // glow: two soft blooms of the gradient behind the sparkle, black elsewhere
    vec2 c1 = vec2((.86 - .5) * asp, -(.43 - .5)), c2 = vec2((.62 - .5) * asp, -(.60 - .5));
    float g1 = exp(-dot(q - c1, q - c1) * 7.), g2 = exp(-dot(q - c2, q - c2) * 5.);
    bg += sat(PERI, 2.6) * g1 * .32 + sat(MAUVE, 2.8) * g2 * .2 + sat(SKY, 2.) * exp(-dot(q - c1 * .5, q - c1 * .5) * 2.5) * .05;
    surround = bg * 1.2;
  } else {
    // aurora: one soft diagonal ribbon of the gradient behind the mark
    float band = exp(-pow((uv.y - .60 + uv.x * .22) * 7., 2.));
    float band2 = exp(-pow((uv.y - .40 + uv.x * .18) * 11., 2.));
    vec3 rc = mix(sat(PERI, 2.4), sat(MAUVE, 2.8), smoothstep(.2, .8, uv.x + fbm(uv * 2. + uSeed) * .3 - .15));

    surround = rib * .8;

  float di = 0.;
  vec3 col = bg;
  if (uVar == 4.) {
    float di2; vec3 dc = shade(uDrops, uv, 30., .1, surround, di2);
    col = mix(col, dc, di2);
  }

  // sparkle, behind
  float si; vec3 sc = shade(uSpark, uv, uRelS, .12, surround, si);
  float sa = si;
  col = mix(col, sc, sa);
  // its shadow on the ground
  float sg = hgt(uSpark, uv + vec2(-.012, .018));
  col *= 1. - sg * .3 * (1. - sa);

  // the mark, in front
  float ti; vec3 tc = shade(uText, uv, uRelT, .10, surround, ti);
  float ta = ti;
  // its shadow onto the sparkle
  float tg = hgt(uText, uv + vec2(-.01, .014));
  col *= 1. - tg * .4 * (1. - ta);
  col = mix(col, tc, ta);

  gl_FragColor = vec4(col, 1.);
}`;
function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
function tex(unit, c, name) { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
