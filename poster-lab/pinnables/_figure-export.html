<!doctype html><html><head><meta charset="utf-8"><title>figure export</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c" width="1600" height="2000"></canvas>
<script>
/* Exports ONLY the flood-filled figure cut-out, on transparency, so it can be
   uploaded into Figma as an image fill. Same levels and same flood as the
   poster, so the result is pixel-identical to what the poster composites. */
const W=1600,H=2000;
const x=document.getElementById('c').getContext('2d');
function offc(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;
  return{canvas:c,ctx:c.getContext('2d',{willReadFrequently:true})};}
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s;});
function cutout(img,gx,gy,gw,gh){
  const f=offc(W,H),fc=f.ctx;
  fc.fillStyle='#fff';fc.fillRect(0,0,W,H);
  fc.filter='grayscale(1) brightness(1.09) contrast(1.40)';
  fc.drawImage(img,gx,gy,gw,gh);fc.filter='none';
  const px=fc.getImageData(0,0,W,H).data;
  const N=W*H,PAPER_L=236;
  const isPaper=new Uint8Array(N),seen=new Uint8Array(N);
  for(let p=0;p<N;p++){const i=p*4;
    isPaper[p]=(px[i]*.299+px[i+1]*.587+px[i+2]*.114)>=PAPER_L?1:0;}
  const q=new Int32Array(N);let head=0,tail=0;
  const push=p=>{if(isPaper[p]&&!seen[p]){seen[p]=1;q[tail++]=p;}};
  for(let X=0;X<W;X++){push(X);push((H-1)*W+X);}
  for(let Y=0;Y<H;Y++){push(Y*W);push(Y*W+W-1);}
  while(head<tail){const p=q[head++],X=p%W;
    if(X>0)push(p-1);if(X<W-1)push(p+1);if(p>=W)push(p-W);if(p<N-W)push(p+W);}
  const A0=new Uint8Array(N);
  for(let p=0;p<N;p++)A0[p]=seen[p]?0:255;
  const out=offc(W,H),oc=out.ctx;
  const id=oc.createImageData(W,H),d=id.data;
  for(let Y=0;Y<H;Y++)for(let X=0;X<W;X++){
    const p=Y*W+X,i=p*4;let a=A0[p];
    if(a&&X&&Y&&X<W-1&&Y<H-1)a=(A0[p]*4+A0[p-1]+A0[p+1]+A0[p-W]+A0[p+W])/8;
    if(a>0){d[i]=px[i];d[i+1]=px[i+1];d[i+2]=px[i+2];d[i+3]=Math.round(a);}}
  oc.putImageData(id,0,0);return out.canvas;
}
(async()=>{
  const girl=await load('assets/mixr-girl.png');
  const gh=H*0.63, gw=gh*girl.width/girl.height;
  const gx=(W-gw)/2, gy=H-gh;
  x.drawImage(cutout(girl,gx,gy,gw,gh),0,0);
  document.title='READY';
})();
</script></body></html>
