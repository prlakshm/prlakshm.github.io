<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mixr — through glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#17181C;display:grid;place-items:center;min-height:100vh;font:12px/1.4 ui-monospace,Menlo,monospace;color:#9CA3AF}
  canvas{height:min(96vh,1200px);width:auto;box-shadow:0 30px 90px rgba(0,0,0,.55)}
  body.export canvas{height:2000px;box-shadow:none}
  .hud{position:fixed;left:16px;bottom:14px;letter-spacing:.06em}
  .hud a{color:#C9B9F4;margin-right:10px;text-decoration:none}
  .hud a.on{color:#fff;text-decoration:underline}
  body.export .hud{display:none}
</style>
</head>
<body>
<canvas id="c" width="1600" height="2000"></canvas>
<div class="hud" id="hud"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   MIXR — THROUGH GLASS

   One picture, seen through twenty panes.

   The picture (the "plate") is a single composition the size of the sheet:
   a thermal gradient field that runs across the whole poster, a pair of
   headphones hanging in its upper middle, and MIXR set below them. None of
   it knows about tiles.

   Then the glass. The sheet is divided into 5 × 4 panes and every pane
   re-samples the plate through its own piece of warped glass: a lens that
   bends the picture (more at the pane's edges, every pane bent differently),
   with the three colour channels refracted to slightly different places so
   the edges disperse. The field and the headphones take the full bend; the
   type takes a third of it, so it stays a word.

   Everything is per pixel; the only bitmap is the headphones.
   ═══════════════════════════════════════════════════════════════════════ */
const W = 1600, H = 2000, COLS = 5, ROWS = 4;
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { antialias: false, preserveDrawingBuffer: true });

const MX = {
  black: '050816', navy: '1A1830', deep: '0B0B16',
  purple: '7231DD', purple2: '9873EB', pink: 'FF5FA2', pinkHi: 'FF7FB8',
  blue: '0EA5E9', blueHi: '38BDF8', yellow: 'EAB308', yellowHi: 'FACC15', red: 'EF4444',
  lavender: 'C9B9F4', lilac: 'E4DBFA', violet: 'C084FC', white: 'FFFFFF',
};
const rgb = h => [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];

/* Options: the ramp and the bend. Lavender is used only as the far bright
   end of the ramp, never as a zone. */
const OPTS = {
  A: { name: 'Rack · blue to pink', stops: [[0, 'black'], [0.12, 'navy'], [0.28, 'blue'], [0.44, 'blueHi'], [0.5, 'yellowHi'], [0.54, 'red'], [0.6, 'pink'], [0.76, 'pinkHi'], [0.94, 'lilac'], [1, 'white']], bend: 0.7, seed: 5, streak: 10, scale: 2.2, dark: 0.6 },
  B: { name: 'Electric · purple in', stops: [[0, 'black'], [0.14, 'navy'], [0.28, 'purple'], [0.44, 'blue'], [0.54, 'yellow'], [0.59, 'pink'], [0.76, 'pinkHi'], [0.94, 'lilac'], [1, 'white']], bend: 0.8, seed: 17, streak: 12, scale: 2.0, dark: 0.6 },
  C: { name: 'Heat · red and yellow', stops: [[0, 'black'], [0.14, 'deep'], [0.26, 'purple'], [0.36, 'violet'], [0.44, 'red'], [0.5, 'yellowHi'], [0.58, 'pink'], [0.72, 'blueHi'], [0.9, 'lilac'], [1, 'white']], bend: 0.65, seed: 31, streak: 9, scale: 2.4, dark: 0.6 },
  D: { name: 'Full rack', stops: [[0, 'black'], [0.14, 'navy'], [0.3, 'blue'], [0.4, 'yellow'], [0.44, 'red'], [0.5, 'pink'], [0.6, 'purple2'], [0.68, 'blueHi'], [0.78, 'pinkHi'], [0.92, 'lilac'], [1, 'white']], bend: 0.75, seed: 71, streak: 9, scale: 2.3, dark: 0.6 },
};
const qs = new URLSearchParams(location.search);
const opt = qs.get('o') || 'A';
const O = OPTS[opt] || OPTS.A;

// ---------------------------------------------------------------- GL helpers
function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const VERT = `attribute vec2 p; varying vec2 v; void main(){ v = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
function program(frag) {
  const pr = gl.createProgram();
  gl.attachShader(pr, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  return pr;
}
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
function useProg(pr) {
  gl.useProgram(pr);
  const a = gl.getAttribLocation(pr, 'p');
  gl.enableVertexAttribArray(a);
  gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  return n => gl.getUniformLocation(pr, n);
}
function tex2d(w, h, data) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  if (data instanceof Uint8Array || data === null) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function rampTexture(stops) {
  const n = 256, data = new Uint8Array(n * 4);
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    let k = 0;
    while (k < stops.length - 2 && stops[k + 1][0] < t) k++;
    const [t0, c0] = stops[k], [t1, c1] = stops[k + 1];
    const u = Math.max(0, Math.min(1, (t - t0) / Math.max(1e-5, t1 - t0)));
    const s = u * u * (3 - 2 * u);
    const a = rgb(MX[c0]), b = rgb(MX[c1]);
    for (let c = 0; c < 3; c++) data[i * 4 + c] = Math.round(255 * (a[c] + (b[c] - a[c]) * s));
    data[i * 4 + 3] = 255;
  }
  return tex2d(n, 1, data);
}

// ---------------------------------------------------------------- pass 1: the field
const FIELD = `
precision highp float;
varying vec2 v;
uniform sampler2D uRamp;
uniform float uSeed, uStreak, uScale;
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p){
  float s = 0.0, a = 0.55;
  for (int i = 0; i < 3; i++){ s += a * vnoise(p); p = p * 2.1 + 17.1; a *= 0.42; }
  return s / 0.95;
}
void main(){
  // one picture across the whole sheet: tall, soft, streaked upward
  vec2 q = vec2(v.x, 1.0 - v.y) * vec2(1.0, 1.25);
  vec2 p = vec2(q.x * uScale, q.y * uScale / uStreak) + uSeed;
  vec2 w = vec2(fbm(p * 0.8 + 3.0), fbm(p * 0.8 + 9.0)) - 0.5;
  p += w * 1.1;
  float f = fbm(p * 1.0);
  f += 0.04 * sin(q.y * 22.0 + fbm(p * 3.0) * 5.0);
  // the light sits behind the headphones: a wide glow in the upper middle
  // that the whole picture is lit by, falling away toward the corners and
  // the foot — so the black headphones read against colour, not against dark
  vec2 hc = vec2(0.5, 0.42);
  float halo = exp(-dot((q - hc) * vec2(1.1, 0.9), (q - hc) * vec2(1.1, 0.9)) * 2.6);
  f = f * 0.78 + 0.07 + halo * 0.2 - 0.16 * smoothstep(0.75, 1.25, q.y);
  f = smoothstep(0.24, 0.84, f);
  gl_FragColor = vec4(texture2D(uRamp, vec2(f, 0.5)).rgb, 1.0);
}`;

// ---------------------------------------------------------------- pass 2: the glass
const GLASS = `
precision highp float;
varying vec2 v;
uniform vec2 uRes;
uniform sampler2D uPlate, uPhones, uType;
uniform vec2 uGrid;
uniform vec4 uFrame;    // margin x, margin y, gutter, corner radius
uniform float uBend, uSeed, uDark;

vec2 hash2(vec2 p){ p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
float ign(vec2 p){ return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }

// The bend of one pane: a lens whose profile is a few sines, different per
// pane. Returns a displacement in sheet UV. Strongest toward the pane's edges,
// so each pane keeps a clear centre and smears at its rim, like thick glass.
vec2 lens(vec2 q, vec2 id, float k){
  vec2 r = hash2(id * 5.7 + uSeed);
  vec2 r2 = hash2(id * 9.1 + uSeed + 3.0);
  float ax = 0.5 + r.x * 1.8, ay = 0.5 + r.y * 1.8;      // waves across the pane
  float px = r2.x * 6.28, py = r2.y * 6.28;
  vec2 c = q - 0.5;
  float edge = smoothstep(0.1, 0.5, max(abs(c.x), abs(c.y)));
  vec2 d;
  d.x = sin(q.y * 6.28 * ay + py) * 0.03 + c.x * abs(c.x) * 0.14;
  d.y = sin(q.x * 6.28 * ax + px) * 0.04 + c.y * abs(c.y) * 0.08;
  // a vertical pull, so the smear runs the way the field does
  d.y += (hash(id + uSeed) - 0.5) * 0.08;
  return d * (0.35 + 0.65 * edge) * k;
}

vec3 plateAt(vec2 uv){
  vec3 c = texture2D(uPlate, uv).rgb;
  vec4 ph = texture2D(uPhones, uv);
  // the headphones: a dark body that keeps a little of the light behind it
  c = mix(c, c * 0.06 + ph.rgb * 0.55, min(1.0, ph.a * uDark * 2.4));
  return c;
}

void main(){
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 inner = uRes - 2.0 * uFrame.xy;
  vec2 cell = (inner - uFrame.z * (uGrid - 1.0)) / uGrid;
  vec2 rel = px - uFrame.xy;
  vec2 id = floor(rel / (cell + uFrame.z));
  vec2 local = rel - id * (cell + uFrame.z);
  vec3 col = vec3(0.02, 0.025, 0.06);
  bool inSheet = rel.x >= 0.0 && rel.y >= 0.0 && id.x < uGrid.x && id.y < uGrid.y;
  if (inSheet){
    vec2 hc = cell * 0.5;
    vec2 d = abs(local - hc) - (hc - uFrame.w);
    float sd = length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - uFrame.w;
    float edge = 1.0 - smoothstep(-1.0, 1.0, sd);
    if (edge > 0.0){
      vec2 q = local / cell;                      // 0..1 in the pane
      vec2 uv = vec2(px.x / uRes.x, 1.0 - px.y / uRes.y);   // sheet uv, y up for the textures
      vec2 bend = lens(q, id, uBend) * vec2(cell.x / uRes.x, cell.y / uRes.y) * 3.0;
      bend.y = -bend.y;
      // dispersion: the three channels bend by slightly different amounts
      float rim = smoothstep(-30.0, 0.0, sd);
      float disp = 0.04 + 0.1 * rim;
      vec3 c = vec3(plateAt(uv + bend * (1.0 + disp)).r, plateAt(uv + bend).g, plateAt(uv + bend * (1.0 - disp)).b);
      // the type: a third of the bend, and no dispersion to speak of
      vec2 tb = bend * 0.2;
      float ta = texture2D(uType, uv + tb).a;
      float tr = texture2D(uType, uv + tb * 1.06).a, tbl = texture2D(uType, uv + tb * 0.94).a;
      c = mix(c, vec3(1.0), vec3(tr, ta, tbl) * 0.96);

      // glass: bevel lit from the top left, inner shadow, a specular sweep
      float bw = 8.0;
      float bev = smoothstep(-bw, 0.0, sd);
      float lit = clamp(dot(normalize(vec2(-1.0, -1.0)), normalize(local - hc)), -1.0, 1.0);
      c += bev * (0.5 * max(lit, 0.0) - 0.35 * max(-lit, 0.0));
      c *= 1.0 - 0.26 * smoothstep(-20.0, -2.0, sd) * (1.0 - bev);
      float spec = smoothstep(0.0, 0.16, q.y) * smoothstep(0.4, 0.16, q.y);
      c += 0.07 * spec;
      c *= 0.93 + 0.12 * (1.0 - q.y);
      c += vec3(0.85, 0.8, 1.0) * smoothstep(1.4, 0.0, abs(sd + 1.0)) * 0.5;
      col = mix(col, c, edge);
    }
    col = mix(col, vec3(0.02, 0.025, 0.06), 1.0 - edge);
    col += (1.0 - edge) * vec3(0.06, 0.05, 0.1) * smoothstep(8.0, 0.0, sd);
  }
  // print grain, with a little colour to it
  float g = ign(gl_FragCoord.xy + uSeed) - 0.5;
  float g2 = ign(gl_FragCoord.yx * 1.3 + uSeed) - 0.5;
  col += vec3(g, g * 0.8 + g2 * 0.2, g2) * 0.045;
  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

// ---------------------------------------------------------------- the plate's bitmaps
function phonesTexture(img) {
  // key the white studio background out, soften the edge, blur the whole
  // thing: it is seen through glass, so it is never sharp
  const S = 1200;
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0, S, S);
  const im = x.getImageData(0, 0, S, S), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    const l = (d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11);
    const a = 1 - Math.max(0, Math.min(1, (l - 150) / 95));
    d[i + 3] = Math.round(255 * a);
  }
  x.putImageData(im, 0, 0);
  // place on a sheet-sized canvas, upper middle, blurred
  const sheet = document.createElement('canvas'); sheet.width = W; sheet.height = H;
  const s = sheet.getContext('2d');
  const size = 1180;
  s.filter = 'blur(7px)';
  s.drawImage(c, (W - size) / 2, 140, size, size);
  s.filter = 'none';
  return tex2d(W, H, sheet);
}
function typeTexture() {
  const sheet = document.createElement('canvas'); sheet.width = W; sheet.height = H;
  const s = sheet.getContext('2d');
  s.fillStyle = '#fff';
  s.textAlign = 'center';
  s.textBaseline = 'alphabetic';
  s.font = '900 400px Archivo, "Archivo Black", Impact, sans-serif';
  // a soft edge so the glass has something to smear
  s.filter = 'blur(1.2px)';
  s.fillText('MIXR', W / 2, 1760);
  s.filter = 'none';
  return tex2d(W, H, sheet);
}

// ---------------------------------------------------------------- render
async function render() {
  await document.fonts.load('900 100px Archivo').catch(() => {});
  await document.fonts.ready;
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = 'assets/mixr-headphones.png'; });

  // pass 1 into a texture
  const plate = tex2d(W, H, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, plate, 0);
  gl.viewport(0, 0, W, H);
  const fieldProg = program(FIELD);
  let U = useProg(fieldProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, rampTexture(O.stops));
  gl.uniform1i(U('uRamp'), 0);
  gl.uniform1f(U('uSeed'), O.seed);
  gl.uniform1f(U('uStreak'), O.streak);
  gl.uniform1f(U('uScale'), O.scale);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // pass 2 to the screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  const glassProg = program(GLASS);
  U = useProg(glassProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, plate); gl.uniform1i(U('uPlate'), 0);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, phonesTexture(img)); gl.uniform1i(U('uPhones'), 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, typeTexture()); gl.uniform1i(U('uType'), 2);
  gl.uniform2f(U('uRes'), W, H);
  gl.uniform2f(U('uGrid'), COLS, ROWS);
  gl.uniform4f(U('uFrame'), 70, 70, 14, 6);
  gl.uniform1f(U('uBend'), O.bend);
  gl.uniform1f(U('uSeed'), O.seed);
  gl.uniform1f(U('uDark'), O.dark);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  document.body.dataset.done = '1';
}
render();

document.getElementById('hud').innerHTML =
  Object.keys(OPTS).map(k => `<a href="?o=${k}" class="${k === opt ? 'on' : ''}">${k} · ${OPTS[k].name}</a>`).join('');
if (qs.has('export')) document.body.classList.add('export');
</script>
</body>
</html>
