<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mixr — Poster (C5B7E2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat+Brush&family=Rubik+Spray+Paint&family=Rubik+Dirt&family=Rock+Salt&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#1c1d22;display:grid;place-items:center;min-height:100vh}
  canvas{height:min(96vh,1200px);width:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  body.export canvas{height:2000px;box-shadow:none}
</style>
</head>
<body>
<canvas id="c" width="1600" height="2000"></canvas>
<script>
const W=1600,H=2000;
// ---- MIXR APP PALETTE (MixrColors.swift), tinted to the reference's value ----
const Q=new URLSearchParams(location.search);
const BGHEX='#'+(Q.get('bg')||'D9C9ED').replace('#','');   // CEB9E8, 5% lighter
const BG_TOP=BGHEX, BG_MID=BGHEX, BG_BOT=BGHEX;               // flat ground

// candidate letterforms for the tag — each sized to hold the same optical
// weight as the others, so the comparison is about voice, not scale
const FACES={
  marker : {family:'Permanent Marker',  size:150, word:'Mixr', spray:1.0},
  brush  : {family:'Caveat Brush',      size:196, word:'Mixr', spray:1.1},
  spray  : {family:'Rubik Spray Paint', size:150, word:'Mixr', spray:0.8},
  dirt   : {family:'Rubik Dirt',        size:150, word:'Mixr', spray:0.8},
  salt   : {family:'Rock Salt',         size:118, word:'Mixr', spray:1.0},
};
const FACE=FACES[Q.get('font')]||FACES.marker;
const GFAM=FACE.family, GWORD=FACE.word;
const GRAF='#4C1FA3';                        // the one graffiti purple, every word
const BLACK='#050816';                       // app background — the stripes
const LAV='#E4DBFA';                         // sfxWaveformTop — lighter than the ground
const WHITE='#FFFFFF';
const INK2='#241B3A';        // near-black purple — the deepest tag
const VIOLET='#7231DD';      // primaryPurple — a brighter can
const PINK='#FF5FA2';        // waveformPink — the one hot accent
const INK='#141024';        // the halftone's ink
const GHOST='#7231DD';      // primaryPurple, printed a hair off-register

const cv=document.getElementById('c'),x=cv.getContext('2d');
if(new URLSearchParams(location.search).has('export'))document.body.classList.add('export');
let seed=90210;
const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});

const WORD_FS=FACE.size;     // ONE size for every graffiti word
const MICRO_FS=21;           // the small type the wave bands are built from
const BAND_ROWS=10;           // rows of it stacked to make one band
const LINE_H=22;
const BAND_GAP=520;
const MB=74;                 // plain poster border, like the RUN reference
const TYPO_Y=-MB;            // all typography lifts by exactly that, so the
const DOWN=20;               // bands + purple tags only, nudged back down
                             // bottom rows clear the border instead of being cut          // one spacing for every band — perfectly even
const RING_STEP=118;         // orbit lines packed tight — an aura, not a field         // distance between contour rings
const RING_START=74;         // the first orbit hugs her silhouette        // first ring sits clear of her silhouette
const STRIPE_HW=21;          // half-thickness of a wave stripe (~42px band)

function grain(alpha){
  const g=document.createElement('canvas');g.width=256;g.height=256;
  const gc=g.getContext('2d'),id=gc.createImageData(256,256);
  for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255|0;id.data[i]=v;id.data[i+1]=v;id.data[i+2]=v;id.data[i+3]=255}
  gc.putImageData(id,0,0);
  x.save();x.globalAlpha=alpha;x.globalCompositeOperation='overlay';
  x.fillStyle=x.createPattern(g,'repeat');x.fillRect(0,0,W,H);x.restore();
}

// Spray-painted word: the paint is laid down, then given uneven coverage,
// ragged stroke edges and an overspray halo — so every face reads as paint on
// a wall rather than as set type. SP scales how hard the can is worked.
function roughWord(txt,fs,color,cx,cy,rot,alpha=1){
  const SP=FACE.spray||1;
  const off=document.createElement('canvas'), o=off.getContext('2d');
  o.font=`${fs}px "${GFAM}"`;
  const w=o.measureText(txt).width;
  const pad=fs*.55, bx=pad, by=fs*1.35;
  off.width=Math.ceil(w+pad*2);off.height=Math.ceil(fs*2.0);
  o.font=`${fs}px "${GFAM}"`;o.textBaseline='alphabetic';

  o.fillStyle=color;o.fillText(txt,bx,by);          // the paint

  o.globalCompositeOperation='destination-out';     // the can spits and skips
  const pits=off.width*off.height/(260/SP);
  for(let i=0;i<pits;i++){
    o.globalAlpha=.3+rnd()*.55;
    o.beginPath();o.arc(rnd()*off.width,rnd()*off.height,.5+rnd()*1.3*SP,0,7);o.fill();
  }
  for(let i=0;i<Math.round(4*SP);i++){              // dry drags
    o.globalAlpha=.2+rnd()*.3;
    o.fillRect(rnd()*off.width,rnd()*off.height,16+rnd()*60,1+rnd()*1.5);
  }
  for(let i=0;i<Math.round(7*SP);i++){              // ragged stroke edges
    o.globalAlpha=.45+rnd()*.5;
    o.beginPath();o.arc(rnd()*off.width,rnd()*off.height,1.6+rnd()*3*SP,0,7);o.fill();
  }
  o.globalAlpha=1;o.globalCompositeOperation='source-over';

  // overspray — mist in a band hugging the glyph, the giveaway of a real can
  const band=document.createElement('canvas');band.width=off.width;band.height=off.height;
  const b=band.getContext('2d');
  b.font=`${fs}px "${GFAM}"`;b.textBaseline='alphabetic';b.fillStyle='#000';
  const R=Math.max(2.5,fs*.028*SP);
  for(let a=0;a<10;a++)b.fillText(txt,bx+Math.cos(a/10*6.283)*R,by+Math.sin(a/10*6.283)*R);
  b.globalCompositeOperation='destination-out';
  b.fillText(txt,bx,by);                            // hollow out the core

  const mist=document.createElement('canvas');mist.width=off.width;mist.height=off.height;
  const m=mist.getContext('2d');m.fillStyle=color;
  const n=off.width*off.height/150;
  for(let i=0;i<n;i++){
    m.globalAlpha=.08+rnd()*.32;
    m.beginPath();m.arc(rnd()*off.width,rnd()*off.height,.4+rnd()*1.3,0,7);m.fill();
  }
  m.globalCompositeOperation='destination-in';m.drawImage(band,0,0);
  o.drawImage(mist,0,0);

  x.save();x.translate(cx,cy);x.rotate(rot);x.globalAlpha=alpha;
  x.drawImage(off,-off.width/2,-off.height/2);x.restore();
  return w;
}

async function draw(){
  await document.fonts.load(`400 ${WORD_FS}px "${GFAM}"`);
  await document.fonts.load(`700 ${MICRO_FS}px "Space Mono"`);
  const girl=await load('assets/mixr-girl.png');

  // ── L1 · light purple ground
  const bg=x.createLinearGradient(0,0,W*.3,H);
  bg.addColorStop(0,BG_TOP);bg.addColorStop(.5,BG_MID);bg.addColorStop(1,BG_BOT);
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  for(let i=0;i<8;i++){
    const g=x.createRadialGradient(rnd()*W,rnd()*H,0,rnd()*W,rnd()*H,320+rnd()*520);
    g.addColorStop(0,`rgba(255,255,255,${.04+rnd()*.05})`);g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g;x.fillRect(0,0,W,H);
  }

  // ── the figure, pre-levelled so her paper clips to true white ──
  const gh=H*0.76, gw=gh*girl.width/girl.height;     // tighter crop on her
  const FIG_Y=0;
  const gx=(W-gw)/2, gyBase=H-gh, gy=gyBase+FIG_Y;

  function buildSilhouette(gyPos){
    const fig=document.createElement('canvas');fig.width=W;fig.height=H;
    const f2=fig.getContext('2d');
    f2.fillStyle='#fff';f2.fillRect(0,0,W,H);
    f2.filter='grayscale(1) brightness(1.10) contrast(1.34)';
    f2.drawImage(girl,gx,gyPos,gw,gh);
    const imgd=f2.getImageData(0,0,W,H), px=imgd.data;
    const N=W*H, PAPER=238;
    const isPaper=new Uint8Array(N), seen=new Uint8Array(N);
    for(let p=0;p<N;p++){
      const i=p*4;
      isPaper[p]=(px[i]*.299+px[i+1]*.587+px[i+2]*.114)>=PAPER?1:0;
    }
    const q=new Int32Array(N);let head=0,tail=0;
    const push=p=>{if(isPaper[p]&&!seen[p]){seen[p]=1;q[tail++]=p}};
    for(let X=0;X<W;X++){push(X);push((H-1)*W+X)}
    for(let Y=0;Y<H;Y++){push(Y*W);push(Y*W+W-1)}
    while(head<tail){
      const p=q[head++], X=p%W;
      if(X>0)push(p-1);
      if(X<W-1)push(p+1);
      if(p>=W)push(p-W);
      if(p<N-W)push(p+W);
    }
    const A0=new Uint8Array(N);
    for(let p=0;p<N;p++)A0[p]=seen[p]?0:255;
    const mask=document.createElement('canvas');mask.width=W;mask.height=H;
    const mk=mask.getContext('2d');
    const md=mk.createImageData(W,H), mdd=md.data;
    let sx=0,sy=0,sn=0,headTop=H;
    for(let Y=0;Y<H;Y++)for(let X=0;X<W;X++){
      const p=Y*W+X, i=p*4;
      let a=A0[p];
      if(a&&X&&Y&&X<W-1&&Y<H-1){
        a=(A0[p]*4+A0[p-1]+A0[p+1]+A0[p-W]+A0[p+W])/8;
      }
      if(a>0){
        mdd[i]=px[i];mdd[i+1]=px[i+1];mdd[i+2]=px[i+2];mdd[i+3]=Math.round(a);
        if(a>128){sx+=X;sy+=Y;sn++;if(Y<headTop)headTop=Y}
      }
    }
    mk.putImageData(md,0,0);
    const mdata=mk.getImageData(0,0,W,H).data;
    const maskAt=(X,Y)=>(X<0||Y<0||X>=W||Y>=H)?0:mdata[((Y|0)*W+(X|0))*4+3];
    const cx0=sn?sx/sn:W/2, cy0=sn?sy/sn:H*.7;
    return {mask,mdd,mdata,maskAt,headTop,cx0,cy0};
  }

  const graf=buildSilhouette(gyBase);                  // graffiti locked to baseline figure
  const fig=buildSilhouette(gy);
  const {mask,mdd,mdata,maskAt,headTop,cx0}=fig;
  const cx0Graf=graf.cx0;
  // the edit extends her dress downward — lock typography to the original
  // canvas positions so the upper field still reads the same
  const REF_MID_SCALP=736, REF_RING_CY=1296, REF_TAG_Y=690;
  const STRIPE_Y=0;
  const ringCy=fig.cy0;

  // distance field from baseline silhouette — graffiti stays locked when FIG_Y moves
  const mddGraf=graf.mdd;

  // The distance field is solved on a domain far LARGER than the poster.
  // Solving it only on the page made distance jump to infinity at the edge,
  // so every outward ray "hit" its target the instant it crossed the border —
  // which is what parked a ring of words along the frame. With the field
  // extended, the orbits keep going past the sheet and are simply clipped.
  const PAD=1000, C=6, INF=1e9;
  const GW=Math.ceil((W+2*PAD)/C), GH=Math.ceil((H+2*PAD)/C);
  const D=new Float32Array(GW*GH).fill(INF);
  for(let b=0;b<GH;b++)for(let a=0;a<GW;a++){
    const X=a*C-PAD+C/2, Y=b*C-PAD+C/2;
    if(X<0||Y<0||X>=W||Y>=H)continue;
    if(mddGraf[((Y|0)*W+(X|0))*4+3]>128)D[b*GW+a]=0;
  }

  // chamfer distance transform (3-4), in grid units
  const at=(a,b)=>(a<0||b<0||a>=GW||b>=GH)?INF:D[b*GW+a];
  for(let b=0;b<GH;b++)for(let a=0;a<GW;a++){
    let v=D[b*GW+a];
    v=Math.min(v,at(a-1,b)+3,at(a,b-1)+3,at(a-1,b-1)+4,at(a+1,b-1)+4);
    D[b*GW+a]=v;
  }
  for(let b=GH-1;b>=0;b--)for(let a=GW-1;a>=0;a--){
    let v=D[b*GW+a];
    v=Math.min(v,at(a+1,b)+3,at(a,b+1)+3,at(a+1,b+1)+4,at(a-1,b+1)+4);
    D[b*GW+a]=v;
  }
  const dist=(X,Y)=>{                       // px distance to the silhouette
    const a=Math.floor((X+PAD)/C), b=Math.floor((Y+PAD)/C);
    if(a<0||b<0||a>=GW||b>=GH)return INF;
    return D[b*GW+a]/3*C;
  };

  // ── L2 · graffiti rings — one size, one purple, wrapping her and stepping outward
  x.font=`${WORD_FS}px "${GFAM}"`;
  const wordW=x.measureText(GWORD).width;
  const GAP=22;
  const spots=[];
  // a contained cloud around her, like the reference — not a full-page field
  const MAXD=480;
  for(let L=RING_START;L<MAXD;L+=RING_STEP){
    const pts=[];
    for(let ang=0;ang<Math.PI*2;ang+=Math.PI/360){
      const ca=Math.cos(ang),sa=Math.sin(ang);
      let hit=null;
      for(let t=10;t<PAD+2600;t+=8){
        const X=cx0Graf+ca*t, Y=ringCy+sa*t;
        if(X<40-PAD||Y<40-PAD||X>W+PAD-40||Y>H+PAD-40)break;
        if(dist(X,Y)>=L){hit=[X,Y];break}
      }
      if(hit)pts.push(hit);
    }
    let acc=1e9, prev=null;
    for(const p of pts){
      if(prev)acc+=Math.hypot(p[0]-prev[0],p[1]-prev[1]);
      prev=p;
      if(acc<wordW+GAP)continue;
      acc=0;
      const [X,Y]=p;
      if(X<-380||Y<-380||X>W+380||Y>H+380)continue;   // off-sheet: nothing to draw
      // tangent to the contour = gradient of the distance field, turned 90°
      const e=7;
      const dx=dist(X+e,Y)-dist(X-e,Y), dy=dist(X,Y+e)-dist(X,Y-e);
      let rot=Math.atan2(dx,-dy);
      if(Math.cos(rot)<0)rot+=Math.PI;
      rot+=(rnd()-.5)*.16;                                   // only slightly random
      const fade=.98-.26*((L-RING_START)/(MAXD-RING_START));
      spots.push({x:X+(rnd()-.5)*9,y:Y+(rnd()-.5)*9,rot,fade,L});
    }
  }

  // one slot in the aura becomes "an iOS DJ App" — it rides the same orbit
  // and the same tangent as every other word, only the styling differs
  // it is one of the aura's words — same size, same orbit, same tangent —
  // only the colour and the wording differ
  const TAG='iOS DJ App';
  // white carries more optical weight than the purple, so it is set a little
  // smaller to READ the same size as a "Mixr"
  const TAG_FS=Math.round(WORD_FS*0.82);
  const TAG_TILT=-0.60;              // rides the orbit, kicked counter-clockwise
                                     // until it sits at only a slight rightward slant
  x.font=`${TAG_FS}px "${GFAM}"`;
  const tagW=x.measureText(TAG).width;
  const TARGET={x:1120,y:REF_TAG_Y};
  const pick=(strict)=>{
    let bi=-1,bd=1e9;
    spots.forEach((p,i)=>{
      if(p.L>RING_START+RING_STEP*3.2)return;
      const rr=p.rot+TAG_TILT;
      if(Math.abs(Math.sin(rr))>0.42)return;          // must read near-horizontal
      const half=tagW/2*Math.abs(Math.cos(rr))+TAG_FS*.6*Math.abs(Math.sin(rr));
      if(p.x-half<70||p.x+half>W-70)return;           // must sit fully on the sheet
      if(p.y<520||p.y>1000)return;
      if(strict){                                     // …and clear of her body
        for(let k=-.5;k<=.5;k+=.125){
          const sxp=p.x+Math.cos(rr)*tagW*k, syp=p.y+Math.sin(rr)*tagW*k;
          if(maskAt(sxp,syp)>110)return;
        }
      }
      const d=Math.hypot(p.x-TARGET.x,p.y-TARGET.y);
      if(d<bd){bd=d;bi=i}
    });
    return bi;
  };
  let tagIdx=pick(true);
  if(tagIdx<0)tagIdx=pick(false);
  const tagSpot=spots[tagIdx];

  // Fill only the four reviewed pockets while keeping the alternate poster's
  // wider generated aura intact. These draw before the figure so the words
  // tuck naturally behind her silhouette.
  {
    const OFF=TYPO_Y+DOWN;
    const POCKET_FILL=[
      [332,624],[560,556],[812,486],       // above left arm and close above head
      [1182,700],[1302,776],               // above right arm
      [300,998],[452,1052],                // below left arm
    ];
    for(const [px,py] of POCKET_FILL){
      const sy=py-OFF, e=7;
      const dx=dist(px+e,sy)-dist(px-e,sy), dy=dist(px,sy+e)-dist(px,sy-e);
      let rot=Math.atan2(dx,-dy);
      if(Math.cos(rot)<0)rot+=Math.PI;
      rot+=(rnd()-.5)*.16;
      spots.push({x:px,y:sy,rot,fade:.97,L:RING_START});
    }
  }

  spots.forEach(p=>{
    if(p!==tagSpot)roughWord(GWORD,WORD_FS,GRAF,p.x,p.y+TYPO_Y+DOWN,p.rot,p.fade);
  });

  // ── the wave-band system ────────────────────────────────────────
  const A=62, L=920, PH=0;                  // ONE wave for every band — shorter
                                            // wavelength, so more ups and downs
  const yAt=(y0,t)=>y0+A*Math.sin(2*Math.PI*t/L+PH);
  const slopeAt=t=>A*(2*Math.PI/L)*Math.cos(2*Math.PI*t/L+PH);

  // Anchor the stack so the HEAD band's TOPMOST row sits at her mid-scalp and
  // runs over her from there. The rest of that band passes BEHIND her, so it
  // disappears into her head and reappears past her silhouette — which is why
  // no face-clearance search is needed here any more.
  const stack=sh=>{const r=[];for(let y=-BAND_GAP*2+sh;y<H+BAND_GAP*2;y+=BAND_GAP)r.push(y);return r};
  const midScalp=headTop+gh*0.05+TYPO_Y+DOWN;
  const topOff=-(BAND_ROWS-1)/2*LINE_H;                  // where a band's row 0 sits
  const wantCentre=midScalp-topOff;                      // ...so row 0 lands above scalp
  const wantY0=wantCentre-A*Math.sin(2*Math.PI*cx0/L+PH);
  const shift=((wantY0%BAND_GAP)+BAND_GAP)%BAND_GAP;
  const rows=stack(shift);
  let headBand=0,hbd=1e9;
  rows.forEach((y0,i)=>{const d=Math.abs(yAt(y0,cx0)-wantCentre);if(d<hbd){hbd=d;headBand=i}});

  // Only INDIVIDUAL rows ride in front of her. Enumerate every row of every
  // band by the height it actually crosses her at, sorted top to bottom.
  const frontRows=new Map();
  const mark=(i,r)=>{if(r<0||r>=BAND_ROWS)return;const f=frontRows.get(i)||[];if(!f.includes(r)){f.push(r);frontRows.set(i,f)}};
  const zone=(lo,hi)=>{
    const out=[];
    rows.forEach((y0,i)=>{
      for(let r=0;r<BAND_ROWS;r++){
        const y=yAt(y0,cx0)+(r-(BAND_ROWS-1)/2)*LINE_H;
        if(y>headTop+gh*lo&&y<headTop+gh*hi)out.push({i,r,y});
      }
    });
    return out.sort((p,q)=>p.y-q.y);
  };

  let headRow=0;
  for(let r=0;r<BAND_ROWS;r++){
    const y=yAt(rows[headBand],cx0)+(r-(BAND_ROWS-1)/2)*LINE_H;
    if(maskAt(cx0,y)>110){headRow=r;break}
  }
  mark(headBand,headRow+3);             // three rows down from the first that
                                        // touches her — rides over, going lavender

  // across her chest, only the LOWER row — the upper one runs behind
  const chest=zone(0.36,0.60);
  if(chest.length)mark(chest[chest.length-1].i,chest[chest.length-1].r);

  // one through her torso
  const torso=zone(0.62,0.90);
  if(torso.length)mark(torso[Math.floor(torso.length/2)].i,torso[Math.floor(torso.length/2)].r);

  // bottom stripe: second-from-top + middle, with dress showing through the gap
  let bottomBand=-1,bottomY=-1e9;
  rows.forEach((y0,i)=>{const y=yAt(y0,cx0);if(y<H-40&&y>bottomY){bottomY=y;bottomBand=i}});
  if(bottomBand>=0&&bottomBand!==headBand){
    const br=Math.floor(BAND_ROWS/2);
    mark(bottomBand,br);                // the row already riding over her…
    mark(bottomBand,br+2);              // …and the next one down, a row apart
  }

  const WORD='MIXR', TRACK=4;
  const band=(y0,keep,over)=>{
    x.font=`700 ${MICRO_FS}px "Space Mono"`;
    x.textAlign='center';x.textBaseline='middle';x.letterSpacing='4px';
    for(let r=0;r<BAND_ROWS;r++){
      if(!keep(r))continue;
      const off=(r-(BAND_ROWS-1)/2)*LINE_H;
      let t=-160, k=r*2;                     // stagger each row's phase
      while(t<W+160){
        const ch=WORD[k++%WORD.length];
        const cw=x.measureText(ch).width;
        const cxp=t+cw/2, cy=yAt(y0,cxp)+off;
        x.save();x.translate(cxp,cy);x.rotate(Math.atan(slopeAt(cxp)));
        x.fillStyle = (over && maskAt(cxp,cy)>110) ? LAV : BLACK;
        x.fillText(ch,0,0);
        x.restore();
        t+=cw+TRACK;
      }
    }
    x.letterSpacing='0px';x.textAlign='start';x.textBaseline='alphabetic';
  };

  // ── L3 · the bands that run BEHIND her
  rows.forEach((y0,i)=>{const f=frontRows.get(i)||[];band(y0,r=>!f.includes(r),false)});

  // ── L4 · the figure — a purple plate a hair off-register, then her
  const plate=document.createElement('canvas');plate.width=W;plate.height=H;
  const pl=plate.getContext('2d');
  pl.drawImage(mask,0,0);
  pl.globalCompositeOperation='source-in';
  pl.fillStyle=GHOST;pl.fillRect(0,0,W,H);
  x.save();x.globalAlpha=.30;x.drawImage(plate,9,10);x.restore();
  x.drawImage(mask,0,0);                       // true black-and-white figure

  // ── L4b · the few bands that ride OVER her, going lavender as they cross
  rows.forEach((y0,i)=>{const f=frontRows.get(i)||[];if(f.length)band(y0,r=>f.includes(r),true)});

  // the aura's one white slot, drawn last so nothing buries it
  if(tagSpot)roughWord(TAG,TAG_FS,WHITE,tagSpot.x,tagSpot.y+TYPO_Y,tagSpot.rot+TAG_TILT,tagSpot.fade);

  // ── L5 · the one white line, same size as every other word

  // plain poster border, as in the RUN reference
  x.fillStyle=bg;
  x.fillRect(0,0,W,MB); x.fillRect(0,H-MB,W,MB);
  x.fillRect(0,0,MB,H); x.fillRect(W-MB,0,MB,H);

  grain(.055);
}
draw();
window.exportPNG=()=>cv.toDataURL('image/png');
</script>
