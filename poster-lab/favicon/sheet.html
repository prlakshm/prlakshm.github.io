<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:28px;background:#fff;font:13px/1.4 -apple-system,system-ui,sans-serif;color:#333}
.row{display:grid;grid-template-columns:330px repeat(2,250px) 200px;gap:20px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}
.tab{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:9px 9px 0 0;width:220px;font-size:12.5px}
.light{background:#f1f3f4;color:#202124}.dark{background:#35363a;color:#e8eaed}
.tab img{width:16px;height:16px}.big{display:flex;gap:14px;align-items:end}
.big img:nth-child(1){width:32px}.big img:nth-child(2){width:64px}.big img:nth-child(3){width:96px;border-radius:20px}
h3{margin:0 0 4px;font-size:14px}
</style></head><body><div id="r"></div><script>
fetch('labels.json').then(r=>r.json()).then(L=>{const r=document.getElementById('r');for(const[k,t]of Object.entries(L)){r.insertAdjacentHTML('beforeend',`<div class="row"><div><h3>${t}</h3></div><div class="tab light"><img src="${k}.svg">Pranavi Ram — Product De…</div><div class="tab dark"><img src="${k}.svg">Pranavi Ram — Product De…</div><div class="big"><img src="${k}.svg"><img src="${k}.svg"><img src="${k}.svg"></div></div>`)}});
</script></body></html>
