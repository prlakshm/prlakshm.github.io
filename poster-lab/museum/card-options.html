<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Star card options</title>
<!-- the card's real styles and gold stamps; only the variations are added below -->
<link rel="stylesheet" href="/src/styles/tokens.css" />
<link rel="stylesheet" href="/src/components/badges/badges.css" />
<style>
  body { margin: 0; background: #f8fafc; color: #171717; font-family: var(--font-mono); -webkit-font-smoothing: antialiased; padding: 36px 44px 60px; width: 1500px; }
  h2 { font-weight: 400; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #171717; margin: 0 0 6px; }
  .sub { font-size: 12px; letter-spacing: .03em; color: #666; margin: 0 0 18px; max-width: 110ch; line-height: 1.5; }
  .row { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 44px; }
  .cell { display: flex; flex-direction: column; gap: 10px; }
  .cap { font-size: 12px; letter-spacing: .03em; color: #666; max-width: 32ch; line-height: 1.45; }
  .cap b { color: #171717; font-weight: 400; -webkit-text-stroke: .3px currentColor; }
  .guide { position: relative; }
  .guide::after { content: ""; position: absolute; top: 0; bottom: 0; right: var(--g, 18px); border-right: 1px dashed rgba(230, 60, 90, .55); pointer-events: none; }
  .x2 { zoom: 2; }
  .lit .bc-lit { animation: none; }

  /* --- layout variations (expanded card) --- */
  .L1 .bc-slots { justify-content: space-between; }
  .L2 { --slot: 43px; }
  .L2 .bc-slots { justify-content: space-between; }
  .L3.bc-card { width: 276px; }

  /* --- closer: the bulb cropped to its glyph, a tighter gap --- */
  .tight .bc-foot { gap: 3px; }
  .tight .bc-hint { width: auto; height: auto; margin: 0; padding: 4px 0 4px 2px; border-radius: 0; }
  .tight .bc-bulb.crop { width: 10px !important; height: 16px !important; }
  .tight.bc-compact .bc-bulb.crop { width: 7.5px !important; height: 12px !important; }
  .tight .bc-popper { margin-left: -1px; }

  /* --- popper options --- */
  .p2 .bc-popper { width: 21px !important; height: 21px !important; margin: -3px -2px -2px -1px; }
  .p2.bc-compact .bc-popper { width: 16px !important; height: 16px !important; margin: -2px -1.5px -2px -1px; }
  .emoji { font-size: 15px; line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  .bc-compact .emoji { font-size: 12px; }
  .rosette { width: 17px; height: 17px; }
  .bc-compact .rosette { width: 13px; height: 13px; }

  /* --- bulb hover options (shown as the hover state) --- */
  .h0 .bc-hint { background: rgba(251, 231, 161, 0.35); }
  .h1 .bc-bulb-glass { fill: #f7d25c; }
  .h1 .bc-bulb { filter: drop-shadow(0 0 2.5px rgba(247, 205, 80, .9)); }
  .h2 .bc-bulb-glass { fill: #f7d25c; }
  .h2 .rays { opacity: 1 !important; }
  .h3 .bc-bulb { transform: translateY(-1.5px) rotate(-10deg); filter: drop-shadow(0 0 2px rgba(247, 205, 80, .8)); }
  .h3 .bc-bulb-glass { fill: #f7d25c; }
  .rays { opacity: 0; }
</style>
</head>
<body>
<div id="v"></div>
<script type="module">
const TILT = [-7, 5, -3, 8, -5];
const STAR = 'M12 2.6l2.75 5.75 6.3.8-4.62 4.37 1.2 6.25L12 16.7l-5.63 3.07 1.2-6.25L2.95 9.15l6.3-.8z';
const slot = (i, on) => on
  ? `<span class="bc-slot is-found" style="--tilt:${TILT[i]}deg"><span class="bc-stamp" style="--i:${i}"><span class="bc-lit bc-lit--l"></span><span class="bc-lit bc-lit--c"></span><span class="bc-lit bc-lit--r"></span></span></span>`
  : `<span class="bc-slot" style="--tilt:${TILT[i]}deg"><svg class="bc-slot-star" viewBox="0 0 24 24"><path d="${STAR}" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1.2 1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
const slots = (n) => `<div class="bc-slots">${[0, 1, 2, 3, 4].map((i) => slot(i, i < n)).join('')}</div>`;
const RAYS = '<g class="rays" stroke="#f2c94c" stroke-width="1.1" stroke-linecap="round"><path d="M8 -1.6v1.5M2.2 1.2l1.1 1.1M13.8 1.2l-1.1 1.1M0 6.6h1.5M16 6.6h-1.5"/></g>';
const bulb = (crop, rays) => `<svg class="bc-bulb${crop ? ' crop' : ''}" viewBox="${crop ? '3 0 10 16' : '0 0 16 16'}" style="overflow:visible">${rays ? RAYS : ''}<path class="bc-bulb-glass" d="M8 1.8a4.2 4.2 0 0 0-2.4 7.65c.4.3.65.75.65 1.25v.6h3.5v-.6c0-.5.25-.95.65-1.25A4.2 4.2 0 0 0 8 1.8z"/><path class="bc-bulb-base" d="M6.4 13.3h3.2M7 14.8h2" fill="none" stroke-width="1.1" stroke-linecap="round"/></svg>`;
const POPPER = `<svg class="bc-popper" viewBox="0 0 16 16"><path d="M1.6 14.4l4.45-10.05 5.6 5.6z" fill="#fbe7a1"/><path d="M3.69 9.68l1.43-3.22 4.42 4.42-3.22 1.43z" fill="#f3d27a"/><path d="M8.9 6.7c.9-1.2 2-.5 2.8-1.5.7-.9.2-2 1.2-2.6" fill="none" stroke="#f2a7bf" stroke-width="1.1" stroke-linecap="round"/><rect x="6.9" y="1.5" width="2.1" height="1.2" rx=".5" transform="rotate(-28 7.95 2.1)" fill="#c9b8ef"/><rect x="12.6" y="7.3" width="2.1" height="1.2" rx=".5" transform="rotate(32 13.65 7.9)" fill="#a8d4f0"/><circle cx="14.3" cy="3.4" r=".85" fill="#f6c95c"/><circle cx="11.9" cy="8.9" r=".7" fill="#f2a7bf"/><circle cx="4.9" cy="3.6" r=".65" fill="#a8d4f0"/></svg>`;
// bolder: the same drawing, saturated and chunkier, fewer tiny bits
const POPPER_BOLD = `<svg class="bc-popper" viewBox="0 0 16 16"><path d="M1.4 14.6l4.55-10.25 5.7 5.7z" fill="#f5c64e"/><path d="M3.55 9.75l1.45-3.25 4.5 4.5-3.25 1.45z" fill="#e3a72e"/><path d="M8.7 6.6c.95-1.3 2.1-.55 2.95-1.6.75-.95.2-2.1 1.3-2.75" fill="none" stroke="#ec6f9c" stroke-width="1.45" stroke-linecap="round"/><rect x="6.5" y="1.1" width="2.7" height="1.6" rx=".6" transform="rotate(-28 7.85 1.9)" fill="#9f86f2"/><rect x="12.3" y="7.1" width="2.7" height="1.6" rx=".6" transform="rotate(32 13.65 7.9)" fill="#4ea7e6"/><circle cx="14.4" cy="3.3" r="1.1" fill="#f3b33a"/><circle cx="12.1" cy="9.4" r=".9" fill="#ec6f9c"/></svg>`;
const ROSETTE = `<svg class="rosette" viewBox="0 0 16 16"><path d="M5.2 9.6L3.4 15l2.2-.9 1.4 1.7 1.3-4.9zM10.8 9.6l1.8 5.4-2.2-.9-1.4 1.7-1.3-4.9z" fill="#d79a2b"/><path d="M8 .6l1.35 1.1 1.7-.35.6 1.6 1.6.6-.35 1.7 1.1 1.35-1.1 1.35.35 1.7-1.6.6-.6 1.6-1.7-.35L8 12.1l-1.35-1.1-1.7.35-.6-1.6-1.6-.6.35-1.7L2 6.35 3.1 5l-.35-1.7 1.6-.6.6-1.6 1.7.35z" fill="#f0c04a"/><circle cx="8" cy="6.35" r="3.1" fill="#f8d97a"/><path d="M8 4.5l.55 1.15 1.25.15-.92.85.24 1.24L8 7.3l-1.12.59.24-1.24-.92-.85 1.25-.15z" fill="#d79a2b"/></svg>`;
const count = (n) => `<span class="bc-count">${n}<span class="bc-slash">/</span>5</span>`;
const welcome = '<div class="bc-note"><p class="bc-note-lead">Welcome to my museum of fine art!</p><p>Can you find all 5 hidden interactions?</p></div>';
const done = '<div class="bc-note"><p class="bc-note-lead">You found them all!</p><p>Thank you for visiting.</p></div>';
const full = ({ n = 2, cls = '', icon, note = welcome, guide = 18 } = {}) => `<div class="guide" style="--g:${guide}px"><div class="bc-card lit ${cls}">${note}${slots(n)}<div class="bc-foot">${count(n)}${icon ?? `<button class="bc-hint">${bulb(false)}</button>`}</div></div></div>`;
const compact = ({ n = 2, cls = '', icon } = {}) => `<span class="bc-compact lit ${cls}">${slots(n)}<span class="bc-foot">${count(n)}${icon ?? bulb(false)}</span></span>`;
const cell = (html, cap) => `<div class="cell">${html}<div class="cap">${cap}</div></div>`;

document.getElementById('v').innerHTML = `
<h2>1 · Layout: line the stars up with the count and bulb</h2>
<p class="sub">The pink dashed line is the card's right content edge. Today the stars stop short of it, so the star row and the count + bulb don't share a right edge.</p>
<div class="row">
${cell(full({}), '<b>A · now</b>: 38px stars, 12px gaps, the row ends ~26px short of the bulb')}
${cell(full({ cls: 'L1' }), '<b>B · spread</b>: same stars spaced edge to edge (gaps ~18px); last star lines up with the bulb')}
${cell(full({ cls: 'L2' }), '<b>C · bigger</b>: 43px stars fill the width with normal gaps; the prize reads bigger')}
${cell(full({ cls: 'L3', guide: 18 }), '<b>D · narrower card</b> (276px): the row nearly fits, but the welcome line wraps')}
</div>

<h2>2 · Bulb and popper closer to the count</h2>
<p class="sub">The bulb sits in a 26px round hit area, and its glyph has ~4px of empty space on each side of a 16px box, so it floats ~14px from the "5". Cropping the glyph and tightening the gap brings it to ~4px.</p>
<div class="row">
${cell(`<div class="x2">${full({ cls: 'L2' })}</div>`, '<b>now</b> (2×)')}
${cell(`<div class="x2">${full({ cls: 'L2 tight', icon: `<button class="bc-hint">${bulb(true)}</button>` })}</div>`, '<b>closer</b> (2×)')}
</div>
<div class="row">
${cell(`<div class="x2">${compact({})}</div>`, '<b>compact now</b> (2×)')}
${cell(`<div class="x2">${compact({ cls: 'tight', icon: bulb(true) })}</div>`, '<b>compact closer</b> (2×)')}
</div>

<h2>3 · The completion icon: the popper reads poorly at 12-16px</h2>
<p class="sub">Why: its pastel cone and eight tiny confetti bits (0.6-0.85px dots at 12px) are below what the eye resolves, so it blurs to a pale smudge; the bulb is one solid shape. Shown on the compact card (2×) and the full card.</p>
<div class="row">
${cell(`<div class="x2">${compact({ n: 5, icon: POPPER })}</div>${full({ n: 5, cls: 'L2', note: done, icon: `<span class="bc-hint">${POPPER}</span>` })}`, '<b>A · now</b>: pastel, many tiny bits')}
${cell(`<div class="x2">${compact({ n: 5, icon: POPPER_BOLD })}</div>${full({ n: 5, cls: 'L2', note: done, icon: `<span class="bc-hint">${POPPER_BOLD}</span>` })}`, '<b>B · bolder</b>: same drawing, saturated, chunkier, fewer bits')}
${cell(`<div class="x2">${compact({ n: 5, cls: 'p2', icon: POPPER_BOLD })}</div>${full({ n: 5, cls: 'L2 p2', note: done, icon: `<span class="bc-hint">${POPPER_BOLD}</span>` })}`, '<b>C · bolder + bigger</b>: drawn ~30% larger than the bulb, same footprint')}
${cell(`<div class="x2">${compact({ n: 5, icon: '<span class="emoji">🎉</span>' })}</div>${full({ n: 5, cls: 'L2', note: done, icon: '<span class="bc-hint"><span class="emoji">🎉</span></span>' })}`, '<b>D · the real 🎉 emoji</b>: instantly readable; looks different on Mac, Windows and Android')}
${cell(`<div class="x2">${compact({ n: 5, icon: ROSETTE })}</div>${full({ n: 5, cls: 'L2', note: done, icon: `<span class="bc-hint">${ROSETTE}</span>` })}`, '<b>E · a gold rosette</b>: the museum prize ribbon, in the same gold as the stars')}
</div>

<h2>4 · Bulb hover (shown in its hover state, 2×)</h2>
<p class="sub">Today a pale-yellow disc appears behind the bulb. Options that keep it to the bulb itself:</p>
<div class="row">
${cell(`<div class="x2">${full({ cls: 'L2 h0' })}</div>`, '<b>now</b>: a pale-yellow disc behind')}
${cell(`<div class="x2">${full({ cls: 'L2 tight h1', icon: `<button class="bc-hint">${bulb(true)}</button>` })}</div>`, '<b>A · it lights up</b>: warmer yellow + a soft glow')}
${cell(`<div class="x2">${full({ cls: 'L2 tight h2', icon: `<button class="bc-hint">${bulb(true, true)}</button>` })}</div>`, '<b>B · rays</b>: lights up with small rays')}
${cell(`<div class="x2">${full({ cls: 'L2 tight h3', icon: `<button class="bc-hint">${bulb(true)}</button>` })}</div>`, '<b>C · a nudge</b>: tilts up a little as it lights')}
</div>`;
document.body.dataset.ready = '1';
</script>
</body>
</html>
