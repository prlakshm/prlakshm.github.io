    <!-- The storm: arriving here (a click, or a link from elsewhere) the pieces
         fall through a gravity well into place, sweeping away the page you
         came from. Not on a reload or Back/Forward. Decided here, before the
         first frame, so nothing flashes in place first. ?slow=4 plays it in
         slow motion.
         Desktop Chromium only (Chrome, Edge, Arc, Brave): ~60 tiles flying
         close to the camera in 3D become huge GPU layers, and on iPhones that
         ran Safari out of memory (the page crashed and reloaded in a loop).
         Everyone else simply gets the canvas. Keep in step with
         src/motion/stormHandoff.ts. -->
