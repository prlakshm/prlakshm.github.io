    <!-- The storm: arriving here (a click, or a link from elsewhere) the pieces
         fly in from the edges, spiral through a tight eye and swoop down into
         place, washing out the page you came from. Not on a reload or
         Back/Forward. Decided here, before the first frame, so nothing flashes
         in place first. ?slow=4 plays it in slow motion. -->
    <style>@view-transition { navigation: auto; }</style>
    <script>
      (function () {
        var d = document.documentElement;
        var nav = performance.getEntriesByType("navigation")[0];
        var storm = (!nav || nav.type === "navigate") && !matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (storm) d.classList.add("gx-storm", "gx-storm-air");
        var slow = parseFloat(new URLSearchParams(location.search).get("slow")) || 1;
        d.style.setProperty("--gx-slow", String(slow));
        addEventListener("pagereveal", function (e) {
          if (!e.viewTransition) return;
          var vt = e.viewTransition; [vt.ready, vt.finished, vt.updateCallbackDone].forEach(function (p) { p && p.catch(function () {}); });
          if (!storm) { e.viewTransition.skipTransition(); return; }
          window.__gxStormVT = e.viewTransition;
        });
      })();
    </script>
